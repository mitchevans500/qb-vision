/* Layout idea: a night game. The lit field is the only bright thing on screen; everything around it
   is a dark sideline with chalk type and one penalty-flag yellow for the thing to press next. */
:root {
  color-scheme: dark;
  --night: #0b1712;
  --panel: #12241b;
  --panel-2: #1a3326;
  --line: #2b4a3a;
  --chalk: #f3f0e5;
  --chalk-dim: #a7b8ab;
  --flag: #ffd23f;
  --flag-ink: #231a00;
  --good: #7be38f;
  --bad: #ff8068;
  --font-display: 'Graduate', 'Rockwell', 'Courier New', serif;
  --font-body: 'Lexend', 'Trebuchet MS', 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body {
  background: var(--night); color: var(--chalk);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overflow: hidden;
  /* a game, not a document: no text selection or long-press menus under a kid's thumb */
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

#app {
  height: 100%; display: flex; flex-direction: column;
  /* Home Screen web app on iPad: keep clear of the status bar, the rounded corners and the home bar */
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.bar {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--night);
}
.brand { font-family: var(--font-display); font-size: 20px; letter-spacing: .06em; padding: 6px 4px; }
.brand b { color: var(--flag); font-weight: 400; }
.bar-right { display: flex; gap: 8px; align-items: center; }
.pill {
  border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500;
  background: var(--panel); min-height: 44px;
}
@media (hover: hover) { .pill:hover { border-color: var(--chalk-dim); } }

main { flex: 1; min-height: 0; position: relative; }
.screen { position: absolute; inset: 0; display: none; }
#app[data-screen="home"] #home, #app[data-screen="practice"] #practice, #app[data-screen="playhub"] #playhub, #app[data-screen="pick"] #pick, #app[data-screen="play"] #play, #app[data-screen="locker"] #locker,
#app[data-screen="learnhub"] #learnhub, #app[data-screen="tree"] #tree, #app[data-screen="form"] #form { display: flex; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size: 17px;
  background: var(--panel-2); border: 1.5px solid var(--line); text-align: center;
}
@media (hover: hover) { .btn:hover { border-color: var(--chalk-dim); } }
.btn:active { transform: translateY(1px); }
.btn.go { background: var(--flag); color: var(--flag-ink); border-color: var(--flag); }
@media (hover: hover) { .btn.go:hover { filter: brightness(1.06); } }
.btn.big { min-height: 88px; font-size: 24px; font-family: var(--font-display); letter-spacing: .05em; font-weight: 400; }
.btn.quiet { background: none; font-weight: 500; font-size: 15px; min-height: 44px; }
.btn small { display: block; font-weight: 400; font-size: 13px; opacity: .8; }

/* ---------- home ---------- */
#home { gap: 24px; padding: 18px 16px; align-items: stretch; justify-content: center; }
.home-copy { flex: 1 1 360px; max-width: 480px; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 0; }
.home-copy h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: .02em; }
.home-copy h1 span { color: var(--flag); display: block; }
.home-copy .lede { color: var(--chalk-dim); font-size: 18px; max-width: 34ch; }
.menu { display: flex; flex-direction: column; gap: 10px; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.level {
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 8px; background: var(--panel); text-align: center; min-height: 64px;
}
.level strong { display: block; font-size: 15px; }
.level span { font-size: 12px; color: var(--chalk-dim); display: block; line-height: 1.25; }
.level[aria-pressed="true"] { border-color: var(--flag); background: var(--panel-2); }
.level[aria-pressed="true"] strong { color: var(--flag); }
.offline { font-size: 13px; color: var(--chalk-dim); line-height: 1.4; }
.offline.ok { color: var(--good); }
.offline.warn { color: var(--flag); }
.label { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); }
.home-demo { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.home-demo canvas { border-radius: 14px; display: block; max-width: 100%; }
.demo-cap { font-size: 14px; color: var(--chalk-dim); min-height: 2.9em; text-align: center; max-width: 46ch; }
.demo-cap b { color: var(--chalk); font-weight: 500; }

/* ---------- playbook ---------- */
#pick { flex-direction: column; padding: 16px; gap: 12px; overflow: auto; }
.pick-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.pick-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .03em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; min-height: 40px;
}
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--night); border-color: var(--chalk); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 8px 10px; text-align: left;
  display: flex; flex-direction: column; gap: 6px;
}
@media (hover: hover) { .card:hover { border-color: var(--flag); } }
.card canvas { width: 100%; aspect-ratio: 40 / 27; border-radius: 9px; display: block; }
.card .nm { font-weight: 700; font-size: 15px; line-height: 1.2; }
.card .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--chalk-dim); }
.stars { letter-spacing: 2px; color: var(--flag); }
.stars i { font-style: normal; color: var(--line); }

/* ---------- play ---------- */
#play { flex-direction: row; }
.field-col { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.field-wrap { flex: 1 1 auto; min-width: 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 6px 8px 8px; }
#hud { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px 2px; min-height: 44px; }
.chip { background: var(--panel); border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 15px; font-weight: 500; white-space: nowrap; }
.chip b { font-weight: 700; }
.chip.score { background: var(--chalk); color: var(--night); border-color: var(--chalk); font-size: 16px; }
.chip.score.them { background: var(--panel-2); color: var(--chalk); border-color: var(--line); }
.chip.down { border-color: var(--flag); color: var(--flag); }
.chip.hot { background: #5a2410; border-color: #ff8a3d; color: #ffd9b8; }
.chip.total { margin-left: auto; color: var(--flag); }
#field { display: block; border-radius: 12px; touch-action: none; }
#banner {
  position: absolute; left: 50%; top: 18%; transform: translateX(-50%); pointer-events: none; text-align: center;
  font-family: var(--font-display); font-size: clamp(26px, 5vw, 52px); letter-spacing: .04em; line-height: 1.05;
  color: var(--chalk); text-shadow: 0 3px 0 rgba(0,0,0,.55), 0 0 22px rgba(0,0,0,.6); opacity: 0; transition: opacity .18s;
  white-space: nowrap;
}
#banner.on { opacity: 1; }
#banner.good { color: var(--flag); }
#banner.bad { color: var(--bad); }
#banner small { display: block; font-family: var(--font-body); font-size: .36em; letter-spacing: .02em; font-weight: 500; }
#panel {
  flex: none; width: clamp(340px, 33vw, 400px); background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 14px; padding: 16px; overflow: auto; font-size: 19px;
}
.playcard { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.playcard .nm { font-weight: 700; font-size: 16px; line-height: 1.2; }
.playcard .sub { font-size: 12px; color: var(--chalk-dim); white-space: nowrap; }
.q { font-size: 27px; font-weight: 700; line-height: 1.15; }
.help { color: var(--chalk-dim); font-size: 16px; }
.help b { color: var(--chalk); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts.one { grid-template-columns: 1fr; }
.opt { min-height: 100px; flex-direction: column; gap: 2px; font-size: 24px; }
.opt small { font-size: 14px; }
.opt.num { font-family: var(--font-display); font-size: 44px; font-weight: 400; min-height: 110px; }
.note { border-radius: 12px; padding: 10px 12px; background: var(--panel-2); font-size: 15px; }
.note.good { box-shadow: inset 4px 0 0 var(--good); }
.note.bad { box-shadow: inset 4px 0 0 var(--bad); }
.note.tip { box-shadow: inset 4px 0 0 var(--flag); }
.note b { font-weight: 700; }
.note .tag { display: block; margin-top: 4px; font-size: 12px; color: var(--chalk-dim); }
.recv { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.recv button { grid-column: span 2; }
.recv button:nth-child(4) { grid-column: 2 / span 2; }
.recv button {
  min-height: 92px; border-radius: 12px; background: var(--chalk); color: var(--night); font-weight: 700; font-size: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
}
.recv button small { font-size: 12px; font-weight: 500; opacity: .8; }
.recv button:active { background: var(--flag); }
.clock { height: 10px; border-radius: 6px; background: var(--panel-2); overflow: hidden; }
.clock i { display: block; height: 100%; width: 100%; background: var(--flag); transform-origin: left center; }
.bigstars { font-size: 34px; letter-spacing: 6px; color: var(--flag); line-height: 1; }
.bigstars i { font-style: normal; color: var(--line); }
.headline { font-family: var(--font-display); font-size: 24px; line-height: 1.1; letter-spacing: .03em; }
.headline.good { color: var(--flag); } .headline.bad { color: var(--bad); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.checks li { display: flex; gap: 8px; }
.checks li::before { content: '\2605'; color: var(--line); }
.checks li.y::before { color: var(--flag); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }
.row.actions .btn { min-height: 88px; font-size: 20px; }
.grown { display: none; } .grown.open { display: flex; }
.btn.holding { border-color: var(--flag); }
.grid2 .opt { min-height: 88px; }
.row.actions { position: sticky; bottom: -16px; background: var(--panel); padding: 8px 0 16px; margin-bottom: -16px; z-index: 2; }
.row.actions + .row { position: relative; z-index: 3; }   /* the practice buttons sit just under the sticky row, not behind it */
.spacer { flex: 1; }

/* ---------- v2: callouts, stars, game, cards, tiles ---------- */
.pill.stars { color: var(--flag); font-weight: 700; }
.pill.tog[aria-pressed="false"] { opacity: .55; text-decoration: line-through; }
.pill.tog[aria-pressed="true"]::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }   /* on: a green dot (a first-timer could not tell) */
.callout { border-radius: 14px; padding: 12px 14px; background: var(--panel-2); font-size: 20px; line-height: 1.3; }
.callout.good { box-shadow: inset 5px 0 0 var(--good); }
.callout.bad { box-shadow: inset 5px 0 0 var(--bad); }
.callout.tip { box-shadow: inset 5px 0 0 var(--flag); }
.callout small { display: block; font-size: 16px; color: var(--chalk-dim); margin-top: 2px; }
.callout .cov { display: block; font-family: var(--font-display); font-size: 26px; letter-spacing: .04em; color: var(--flag); margin-top: 2px; }
.big { font-size: 20px; line-height: 1.3; }
.vs { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.1; letter-spacing: .03em; }
.star3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
.star3 span { display: flex; flex-direction: column; align-items: center; font-size: 14px; color: var(--chalk-dim); }
.star3 b { font-size: 46px; line-height: 1; color: var(--line); }
.star3 .on { color: var(--chalk); }
.star3 .on b { color: var(--flag); text-shadow: 0 0 18px rgba(255, 210, 63, .45); }
.verdict { font-size: 24px; font-weight: 700; line-height: 1.2; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
details.why { background: var(--panel-2); border-radius: 14px; padding: 10px 14px; font-size: 19px; }
details.why summary { cursor: pointer; list-style: none; }
details.why summary::-webkit-details-marker { display: none; }
details.why summary::after { content: 'More'; display: block; color: var(--chalk-dim); font-size: 14px; text-decoration: underline; margin-top: 4px; }
.because { display: block; font-size: 18px; line-height: 1.3; color: var(--chalk); margin-top: 4px; }
details.why[open] summary::after { content: ''; }
details.why p { font-size: 16px; color: var(--chalk-dim); margin-top: 6px; }
details.why .tag { font-size: 13px; }
.event { font-size: 19px; font-weight: 500; }
.event.new { color: var(--flag); }
.pips { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: middle; }
.pips i { font-style: normal; font-size: 11px; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--line); color: var(--line); }
.pips i.on { background: var(--flag); border-color: var(--flag); color: var(--flag-ink); }
.offer { display: flex; flex-direction: column; gap: 10px; }
.pcard { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--panel-2); border: 2px solid var(--line); border-radius: 14px; padding: 8px; min-height: 84px; }
.pcard canvas { width: 118px; flex: none; aspect-ratio: 40 / 27; border-radius: 8px; display: block; }
.pcard .nm { font-weight: 700; font-size: 18px; line-height: 1.2; }
.pcard .nm .pips { display: flex; margin: 6px 0 0; }
.pcard:hover, .pcard:active { border-color: var(--flag); }
.bronze { border-color: #b9814f !important; } .silver { border-color: #cfd6dc !important; } .gold { border-color: var(--flag) !important; }
.scorebig { font-family: var(--font-display); font-size: 64px; line-height: 1; letter-spacing: .03em; }
.scorebig i { font-style: normal; color: var(--chalk-dim); margin: 0 .2em; }
.scorebig small { font-family: var(--font-body); font-size: 18px; color: var(--chalk-dim); margin-left: 10px; letter-spacing: 0; }
.medal { align-self: flex-start; text-transform: capitalize; font-weight: 700; font-size: 18px; border-radius: 999px; padding: 6px 16px; border: 2px solid; background: var(--panel-2); }
.medal.gold { color: var(--flag); } .medal.silver { color: #cfd6dc; } .medal.bronze { color: #d9a070; }
.headline { font-family: var(--font-display); font-size: 30px; letter-spacing: .04em; line-height: 1.1; }
.headline.good { color: var(--flag); } .headline.bad { color: var(--bad); }
/* home: Coach says, then three doors in order */
#home { align-items: flex-start; justify-content: flex-start; }   /* the path starts near the top: a centred block looked like a page still loading */
.home-path { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 16px; margin: 0 auto; }   /* right under the bar */
.coach-next { background: var(--flag); color: var(--flag-ink); border-radius: 20px; min-height: 96px; padding: 12px 20px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.coach-next small { font-size: 17px; font-weight: 700; opacity: .8; }
.coach-next b { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4.2vw, 40px); line-height: 1.05; letter-spacing: .02em; }
.doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.door { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; min-height: 150px; padding: 14px 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; text-align: left; }
.door i { font-style: normal; font-family: var(--font-display); font-size: 22px; width: 38px; height: 38px; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--flag); }
.door b { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 3.4vw, 38px); letter-spacing: .04em; line-height: 1.1; }
.door-sub { font-size: 17px; color: var(--chalk-dim); }
.door.next { border-color: var(--flag); }
.pill.trophy-pill { font-weight: 700; }
.bar-right .pill { white-space: nowrap; }
/* practice and play: one column of big choices, Home at the bottom */
#practice, #playhub { align-items: flex-start; justify-content: center; overflow: auto; padding: 18px 16px; }
.hub { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 14px; }
.hub h2 { font-family: var(--font-display); font-weight: 400; font-size: 34px; letter-spacing: .03em; }
.hub-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile.big-tile { min-height: 110px; padding: 14px 16px; gap: 4px; }
.tile.big-tile b { font-size: 24px; } .tile.big-tile span { font-size: 16px; }
.tile[disabled] { opacity: .55; }
.hub .levels .level { min-height: 88px; }
.hub-go, .hub-back { min-height: 88px; }
.pick-back { min-height: 56px; min-width: 88px; font-size: 18px; margin-right: 8px; vertical-align: middle; }
@media (max-width: 700px), (orientation: portrait) {
  .doors { grid-template-columns: 1fr; gap: 12px; }
  .door { min-height: 96px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 4px 14px; flex-wrap: wrap; align-content: center; }
  .door b { font-size: 30px; }
  .door-sub { flex-basis: 100%; padding-left: 52px; }
}
@media (max-width: 460px) { .hub-tiles { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .stations.three { grid-template-columns: 1fr; } .stations.three .station { min-height: 96px; } }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; text-align: left; min-height: 66px; display: flex; flex-direction: column; justify-content: center; }
.tile b { font-size: 17px; } .tile span { font-size: 14px; color: var(--chalk-dim); }
@media (hover: hover) { .tile:hover { border-color: var(--chalk-dim); } }
.tile[disabled] { opacity: .5; }
.level[disabled] { opacity: .5; }
.goal { display: flex; flex-direction: column; gap: 4px; }
.goal p { font-size: 14px; color: var(--chalk-dim); } .goal p b { color: var(--flag); font-weight: 700; }
.goal-bar { height: 10px; border-radius: 6px; background: var(--panel-2); overflow: hidden; }
.goal-bar i { display: block; height: 100%; background: var(--flag); border-radius: 6px; }
#toasts { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 8px; pointer-events: none; align-items: center; }
.toast { background: var(--chalk); color: var(--night); border-radius: 999px; padding: 10px 20px; font-size: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.45); opacity: 0; transform: translateY(-14px) scale(.96); transition: opacity .22s, transform .22s; white-space: nowrap; }
.toast.on { opacity: 1; transform: none; }
.toast.gold { background: var(--flag); color: var(--flag-ink); }
/* locker room */
#locker { overflow: auto; padding: 16px; justify-content: center; }
.locker { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 18px; }
.locker h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: .03em; }
.recs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.rec { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.rec b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 30px; color: var(--flag); line-height: 1.1; }
.rec span { font-size: 14px; color: var(--chalk-dim); }
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.trophy { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; opacity: .55; }
.trophy.on { opacity: 1; border-color: var(--flag); }
.trophy .cup { font-size: 30px; filter: grayscale(1); } .trophy.on .cup { filter: none; }
.trophy b { display: block; font-size: 16px; } .trophy span { font-size: 13px; color: var(--chalk-dim); }
.gear { display: flex; flex-wrap: wrap; gap: 8px; }
.gear button { border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 12px; font-size: 16px; min-height: 48px; display: flex; align-items: center; gap: 8px; }
.gear button[aria-pressed="true"] { border-color: var(--flag); background: var(--panel-2); }
.gear button[disabled] { opacity: .5; }
.gear .sw { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,.4); flex: none; }
.gear small { color: var(--chalk-dim); font-size: 12.5px; }
.grown { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
/* training camp */
.camp-list { display: flex; flex-direction: column; gap: 10px; }
.camp-list button { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--panel-2); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; min-height: 64px; font-size: 20px; font-weight: 700; }
.camp-list button i { font-style: normal; font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--flag); width: 34px; text-align: center; flex: none; }
.camp-list button.done { border-color: var(--good); } .camp-list button.done i { color: var(--good); }
.camp-list button span { margin-left: auto; font-size: 14px; font-weight: 500; color: var(--chalk-dim); }
.camp-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dots { display: flex; gap: 6px; } .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--flag); }
#campCv { display: block; border-radius: 12px; margin: 0 auto; touch-action: none; max-width: 100%; }
.camp-q { font-size: 26px; font-weight: 700; text-align: center; line-height: 1.15; min-height: 1.2em; }
.camp-q.good { color: var(--good); } .camp-q.bad { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: stretch; }
.grid2 .h { font-size: 14px; color: var(--chalk-dim); display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 4px; }
.grid2 .opt { font-size: 22px; }
.grid2 .opt.hit { border-color: var(--good); background: #1f4a31; }
.cheat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cheat div { background: var(--panel-2); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.cheat canvas { width: 100%; aspect-ratio: 40 / 22; border-radius: 8px; display: block; }
.cheat b { font-size: 17px; } .cheat span { font-size: 15px; color: var(--chalk-dim); line-height: 1.25; }

/* ---------- v3: the key card. WATCH one defender; the things he can do; no row is the answer before the snap ---------- */
.keycard { background: var(--panel-2); border-radius: 14px; box-shadow: inset 5px 0 0 var(--flag); padding: 12px 14px 12px 18px; display: flex; flex-direction: column; gap: 6px; }
.kc-head { font-size: 20px; font-weight: 700; line-height: 1.25; }
.kc-lab { font-family: var(--font-display); font-weight: 400; color: var(--flag); letter-spacing: .08em; text-transform: uppercase; margin-right: 2px; }
.kc-rows { display: flex; flex-direction: column; }
/* side panel (narrow): what he does on one line, the throw under it */
.kc-row { display: flex; flex-wrap: wrap; column-gap: 8px; border-top: 1.5px solid var(--line); padding: 7px 0; font-size: 20px; line-height: 1.25; }
.kc-did { flex-basis: 100%; font-weight: 700; }
.kc-arrow { color: var(--flag); font-weight: 700; }
.kc-then { flex: 1; }
.kc-text { font-size: 20px; line-height: 1.3; }
/* the small card that stays up after the snap (and the card in a wide panel, below): one line per row, arrows lined up */
.keycard.small .kc-rows { display: grid; grid-template-columns: max-content max-content 1fr; }
.keycard.small .kc-row { display: contents; }
.keycard.small .kc-row > span { border-top: 1.5px solid var(--line); padding: 7px 0; }
.keycard.small .kc-did { padding-right: 12px !important; }
.keycard.small .kc-arrow { padding-right: 10px !important; }
.keycard.small { padding: 6px 12px 6px 14px; gap: 2px; }
.keycard.small .kc-head, .keycard.small .kc-text, .keycard.small .kc-row > span { font-size: 18px; }
.keycard.small .kc-row > span { padding: 4px 0; }
#liveLab { font-size: 18px; letter-spacing: .06em; color: var(--chalk); }
/* a receiver's letter looks like his token on the field */
b.rc { display: inline-flex; align-items: center; justify-content: center; min-width: 1.45em; height: 1.45em; padding: 0 .3em; border-radius: 999px; background: var(--chalk); color: var(--night); font-size: .85em; font-weight: 700; line-height: 1; vertical-align: .08em; }
.hikebar { display: flex; position: sticky; bottom: -16px; margin: auto 0 -16px; padding: 8px 0 16px; background: var(--panel); z-index: 2; }
.hikebar .btn { flex: 1; position: relative; overflow: hidden; }
.btn.go:disabled { background: var(--panel-2); color: var(--chalk-dim); border-color: rgba(255, 210, 63, .45); cursor: default; transform: none; }
.hk-fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 8px; background: var(--flag); transform-origin: left center; transform: scaleX(0); }
.btn.go:not(:disabled) .hk-fill { display: none; }
.recv.wait button { opacity: .38; }
.didbox { background: var(--panel-2); border-radius: 14px; box-shadow: inset 5px 0 0 var(--flag); padding: 12px 14px 12px 18px; display: flex; flex-direction: column; gap: 6px; }
.didbox .did { font-size: 20px; font-weight: 700; line-height: 1.3; }
.didbox .because { font-size: 19px; margin: 0; }
.showed { font-size: 19px; color: var(--chalk); }

/* ---------- learn sheet ---------- */
#learn { position: fixed; inset: 0; background: rgba(5, 12, 9, .82); display: none; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
#learn.on { display: flex; }
.sheet { background: var(--panel); border: 1.5px solid var(--line); border-radius: 18px; max-width: 720px; width: 100%; max-height: 100%; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .03em; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.steps div { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.steps b { color: var(--flag); font-family: var(--font-display); font-weight: 400; margin-right: 6px; }
.covs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.cov { background: var(--panel-2); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.cov canvas { width: 100%; aspect-ratio: 40 / 24; border-radius: 8px; display: block; }
.cov strong { font-size: 16px; }
.cov span { font-size: 13px; color: var(--chalk-dim); line-height: 1.3; }
.cov em { font-style: normal; font-size: 13.5px; line-height: 1.3; }

/* ---------- Learn: the door, the stations, Trace it. Every button here is at least 88 px both ways (a finger, not a mouse) ---------- */
.home-go { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.btn.learn-door { background: var(--panel-2); border-color: var(--flag); color: var(--flag); }
#learnhub { overflow: auto; padding: 18px 16px; justify-content: center; }
.lh { width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 18px; }
.lh-top { display: flex; align-items: center; justify-content: space-between; }
.lh h2 { font-family: var(--font-display); font-weight: 400; font-size: 34px; letter-spacing: .04em; }
.lh-medals { font-size: 28px; font-weight: 700; color: var(--flag); }
.stations { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.station { min-height: 150px; min-width: 88px; border-radius: 18px; background: var(--panel); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; }
.station b { font-size: 22px; } .station small { font-size: 16px; color: var(--chalk-dim); }
.station.on { border-color: var(--flag); background: var(--panel-2); color: var(--flag); }
.station svg { width: 52px; height: 52px; }
.station .lock { font-size: 30px; filter: grayscale(1); opacity: .7; }
.station[disabled] { opacity: .55; cursor: default; }
.poschips { display: flex; flex-wrap: wrap; gap: 10px; }
.poschip { min-width: 88px; min-height: 88px; border-radius: 50%; background: var(--chalk); color: var(--night); font-weight: 700; font-size: 30px; border: 4px solid transparent; }
.poschip[aria-pressed="true"] { background: var(--flag); color: var(--flag-ink); box-shadow: 0 0 0 4px var(--panel), 0 0 0 7px var(--flag); }
.lh-go { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
.lh-go .btn, .tr-btns .btn { min-height: 88px; min-width: 88px; }
#tree, #form { flex-direction: row; }
.tr-field { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px; }
#tvCv { display: block; border-radius: 12px; touch-action: none; }
.tr-panel { flex: none; width: clamp(300px, 30vw, 380px); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; padding: 16px; overflow: auto; }
.tr-dots { display: flex; flex-wrap: wrap; gap: 6px; } .tr-dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); } .tr-dots i.on { background: var(--flag); } .tr-dots i.now { background: var(--chalk); }
.tr-head { display: flex; align-items: center; gap: 12px; }
.tr-name { font-family: var(--font-display); font-size: 30px; line-height: 1.1; letter-spacing: .03em; }
b.rc.tr-rc { font-size: 26px; }
.tr-say { font-size: 30px; font-weight: 700; color: var(--flag); }
.tr-result { display: flex; align-items: center; gap: 14px; min-height: 80px; }
.tr-big { font-size: 72px; line-height: 1; font-weight: 700; }
.tr-result.good .tr-big, .tr-big.good { color: var(--good); }
.tr-hint { font-size: 30px; font-weight: 700; line-height: 1.15; color: var(--bad); }
.tr-medalbox { display: flex; align-items: center; gap: 10px; font-size: 26px; color: var(--flag); }
.tr-medal { font-size: 54px; line-height: 1; }
.tr-done { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.tr-stars { font-family: var(--font-display); font-size: 40px; color: var(--flag); }
.tr-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
.tr-btns .tr-stop { grid-column: 1 / -1; }
.tr-btns .btn:only-child { grid-column: 1 / -1; }


/* ---------- Learn: the route tree ---------- */
.stations.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stations.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.station .rt-icon { font-size: 44px; line-height: 1; }
.lh-go { grid-template-columns: 1fr; max-width: 300px; }
.rt-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rt-modes .btn { min-height: 88px; font-size: 22px; }
.rt-modes .btn.on { background: var(--flag); color: var(--flag-ink); border-color: var(--flag); }
.rt-modes .btn[disabled] { opacity: .45; }
.rt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rt-btn { min-height: 88px; min-width: 88px; border-radius: 14px; background: var(--panel-2); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; line-height: 1.05; }
.rt-btn.on { border-color: var(--flag); color: var(--flag); }
.rt-num { font-family: var(--font-display); font-size: 34px; line-height: 1; }

  /* ---------- Disguise (Starter and All-Pro) ----------
     One pre-snap picture that can turn into either of two coverages. Every defender lines up in a spot he shares
     with his opposite number in the partner coverage, then plays his REAL coverage from where he stands, so the
     picture resolves through his first steps.
       family 'corner' hides how deep the corners are (the safety count stays honest):  C1<->C3, C2<->C4
       family 'safety' hides how many safeties are deep (corner depth stays honest):     C1<->C2, C3<->C4 */
  const PARTNER = { corner: { C1: 'C3', C3: 'C1', C2: 'C4', C4: 'C2' }, safety: { C1: 'C2', C2: 'C1', C3: 'C4', C4: 'C3' } };
  const LAB_RANK = { CB: 0, LB: 1, S: 2 };
  // slot order: corners, underneath, deep, each left to right. Slot k is the same spot in both coverages of a pair.
  const slotOrder = (defs) => defs.filter((d) => d.kind !== 'rush').sort((a, b) => LAB_RANK[a.lab] - LAB_RANK[b.lab] || a.x - b.x || a.y - b.y);
  // A one-deep coverage shown as two deep: one underneath defender stands in the second safety spot and comes down
  // at the snap. He shows on the side that leaves the three underneath defenders nearest the spots they line up in
  // (so he rolls down toward trips or a bunch). The free safety takes the other deep spot and runs toward the side
  // his partner left, so the first steps the quarterback watches already point the way he ends up leaning.
  function rollDown(one, two) {
    const u = one.slice(2, 5), fs = one[5];
    const cost = (spots) => spots.reduce((n, s, k) => n + Math.abs(u[k].x - s.x), 0);
    const cl = cost([two[4], two[2], two[3]]), cr = cost([two[2], two[3], two[5]]);
    const side = Math.abs(cl - cr) < 0.01 ? fs.favor : cl < cr ? -1 : 1;
    fs.favor = side;
    return side < 0 ? [one[0], one[1], u[1], u[2], u[0], fs] : [one[0], one[1], u[0], u[1], fs, u[2]];
  }
  function disguiseDefs(defs, covId, family, pos, seed) {
    const partner = PARTNER[family][covId];
    // the partner's honest picture from the same seed, so both coverages of the pair work out the same shared spots
    let mine = slotOrder(defs), theirs = slotOrder(buildDefense(partner, pos, mulberry32(seed >>> 0)));
    const twoDeep = COVERAGES[covId].deep === 2;
    if (family === 'safety') { if (twoDeep) theirs = rollDown(theirs, mine); else mine = rollDown(mine, theirs); }
    mine.forEach((d, k) => {
      const o = theirs[k];
      d.home = [d.x, d.y];                       // where his real coverage lines him up; his depth is still worked from here
      if (family === 'safety' && k >= 2) {       // hidden safety count: everybody shows the two-deep shell
        if (!twoDeep) { d.x = o.x; d.y = o.y; d.lab = o.lab; }   // the label is the spot he stands in, so one LB reads 'S'
      } else { d.x = (d.x + o.x) / 2; d.y = (d.y + o.y) / 2; }   // otherwise split the difference (hidden corners: about 4 to 6 yards off)
      d.sx = d.x; d.sy = d.y;
    });
    return { family, partner };
  }

  /* ---------- Timelines ---------- */
  function makeTimeline(start, route, speed) {
    const segs = [];
    const delay = route.delay || 0;
    let t = delay, prev = start.slice(), prevDir = null, brkT = route.brk === -2 ? delay + 0.25 : Infinity;
    route.pts.forEach((p, i) => {
      const q = [clampX(p[0]), Math.min(p[1], Y_MAX)];
      const dx = q[0] - prev[0], dy = q[1] - prev[1], len = Math.hypot(dx, dy);
      if (len < 1e-6) return;
      const dir = [dx / len, dy / len];
      if (prevDir) {
        const dot = clamp(prevDir[0] * dir[0] + prevDir[1] * dir[1], -1, 1);
        const ang = Math.acos(dot) * 180 / Math.PI;
        const pause = ang > 100 ? 0.22 : ang > 50 ? 0.12 : ang > 25 ? 0.05 : 0;
        if (pause) { segs.push({ t0: t, t1: t + pause, a: prev, b: prev }); t += pause; }
      }
      const dur = len / speed;
      segs.push({ t0: t, t1: t + dur, a: prev, b: q });
      t += dur;
      if (i === route.brk) brkT = t;
      prev = q; prevDir = dir;
    });
    // readyT: when he is looking for the ball. At his break; 7 yards into a route with no break;
    // a beat after the snap on an immediate route (arrow, drag, flare).
    const readyT = route.lateLook ? delay + 7 / speed : route.brk === -2 ? delay + 0.6 : isFinite(brkT) ? brkT : delay + 7 / speed;
    return { segs, tEnd: t, brkT, readyT, start: start.slice(), end: prev, delay, name: route.name, pts: [start.slice()].concat(route.pts.map((p) => [clampX(p[0]), Math.min(p[1], Y_MAX)])) };
  }
  function posAt(tl, t) {
    if (t <= tl.delay || !tl.segs.length) return tl.start;
    if (t >= tl.tEnd) return tl.end;
    for (let k = 0; k < tl.segs.length; k++) {
      const s = tl.segs[k];
      if (t <= s.t1) {
        const span = s.t1 - s.t0;
        const u = span < 1e-9 ? 1 : (t - s.t0) / span;
        return [s.a[0] + (s.b[0] - s.a[0]) * u, s.a[1] + (s.b[1] - s.a[1]) * u];
      }
    }
    return tl.end;
  }

  /* ---------- Rep setup ---------- */
  function cushionOver(p, defs) {
    let best = 99;
    for (const d of defs) {
      if (d.kind === 'rush') continue;
      const q = d.home || [d.x, d.y];   // a disguised corner: the receiver reads his real depth off his first steps
      if (Math.abs(q[0] - p[0]) <= 2.5 && q[1] > p[1]) best = Math.min(best, q[1] - p[1]);
    }
    return best;
  }

  function createRep(playId, covId, seed, opts) {
    opts = opts || {};
    const play = PLAY_BY_ID[playId];
    const form = FORMATIONS[play.form];
    const rng = mulberry32(seed >>> 0);
    const pos = Object.assign({}, form.pos, play.align || {});
    const defs = buildDefense(covId, pos, rng);
    const disguise = PARTNER[opts.disguise] ? disguiseDefs(defs, covId, opts.disguise, pos, seed) : undefined;
    const tls = {};
    const rushX = defs.find((d) => d.kind === 'rush').x;
    for (const id of ELIG) {
      const p = pos[id];
      const o = p[0] > 0 ? 1 : p[0] < 0 ? -1 : 1;
      const s = { x: p[0], y: p[1], o, i: -o, cush: cushionOver(p, defs), deep: disguise && disguise.family === 'safety' ? 2 : COVERAGES[covId].deep, rush: rushX > 0 ? 1 : -1 };
      tls[id] = makeTimeline(p, play.routes[id](s), P.wr);
    }
    const qbTl = makeTimeline(pos.QB, { pts: play.qb || [], brk: -1, delay: 0.35, name: 'QB' }, P.qb);
    const pressure = opts.pressure || 4.5;
    const rush = defs.find((d) => d.kind === 'rush');
    const rushV = dist([rush.x, rush.y], pos.QB) / pressure;
    const rep = { play, cov: covId, seed, t: 0, pos, tls, qbTl, defs, ball: null, result: null, pressure, rushV };
    if (disguise) rep.disguise = disguise;
    return rep;
  }
  function cloneRep(st) {
    return Object.assign({}, st, { defs: st.defs.map((d) => Object.assign({}, d)), ball: st.ball ? Object.assign({}, st.ball) : null, result: null });
  }

  /* ---------- Defender movement ---------- */
  function moveTo(d, tx, ty, spd, dt) {
    const dx = tx - d.x, dy = ty - d.y, len = Math.hypot(dx, dy);
    if (len < 1e-6) return;
    const stepLen = spd * dt;
    if (len <= stepLen) { d.x = tx; d.y = ty; } else { d.x += dx / len * stepLen; d.y += dy / len * stepLen; }
    d.x = clamp(d.x, -19.5, 19.5);
    d.hx = dx / len; d.hy = dy / len;
  }
  // the depth a defender's coverage works from: where he lined up, or his real spot when he started in disguise
  const homeY = (d) => (d.home ? d.home[1] : d.sy);
  const inBox = (b, x, y, m) => x >= b.x0 - m && x <= b.x1 + m && y >= (b.y0 === undefined ? -99 : b.y0) - m && y <= (b.y1 === undefined ? 99 : b.y1) + m;

  // Can this defender make a play on the ball in the air? Zone defenders jump a throw into their
  // zone once they are close to the catch point or to the receiver. Man defenders never jump the
  // throw; they just keep chasing their receiver.
  function canBreak(d, st, t) {
    const b = st.ball, c = b.to;
    if (d.brk) return true;
    if (d.kind !== 'under' && d.kind !== 'deep') return false;
    const inZone = d.kind === 'under' ? inBox(d.box, c[0], c[1], 1.0)
      : (c[0] >= d.box.x0 - 1 && c[0] <= d.box.x1 + 1 && c[1] >= d.box.y0 - 1);
    if (!inZone) return false;
    const r = posAt(st.tls[b.target], t);
    const dc = Math.hypot(d.x - c[0], d.y - c[1]), dr = Math.hypot(d.x - r[0], d.y - r[1]);
    const ok = d.kind === 'under' ? (dc <= P.underC || dr <= P.underR) : (dc <= (d.range || P.deepC) || dr <= (d.range || P.deepR));
    if (ok) d.brk = true;
    return ok;
  }

  function moveDef(st, d, t, dt, qb) {
    if (d.kind === 'rush') { moveTo(d, qb[0], qb[1], st.rushV * (1 + 1.2 * clamp((t - st.pressure * 0.75) / 1.5, 0, 1)), dt); return; }
    if (st.ball && t - st.ball.t0 >= P.reactBall && canBreak(d, st, t)) {
      moveTo(d, st.ball.to[0], st.ball.to[1], P.def, dt);
      return;
    }
    if (d.kind === 'man') {
      const tl = st.tls[d.man];
      const td = t - P.tauMan;
      const pd = posAt(tl, td);
      let tx, ty;
      if (td < tl.brkT) {
        // hold depth, give a little ground, then run on top of him
        ty = Math.max(pd[1] + 1.0, homeY(d) + Math.min(d.drop, 0.5 * Math.max(0, pd[1] - tl.start[1])));
        tx = pd[0] + d.lev;
        d.gap = ty - pd[1];
      } else {
        const k = clamp((td - tl.brkT) / 0.8, 0, 1);
        ty = pd[1] + lerp(d.gap === undefined ? 1.0 : d.gap, 0.3, k);
        tx = pd[0] + d.lev * (1 - k);
      }
      let spd = (ty > d.y + 0.25 && !d.turned) ? P.bp : d.spd;
      if (!d.turned && pd[1] > d.y - 2.2) d.turned = true;
      // traffic: a man defender running through other bodies gets slowed (rubs, bunches, mesh)
      for (const id of ELIG) {
        if (id === d.man) continue;
        const q = posAt(st.tls[id], t);
        if (Math.hypot(q[0] - d.x, q[1] - d.y) < 0.9) { spd *= 0.55; break; }
      }
      moveTo(d, tx, ty, spd, dt);
      return;
    }
    const td = t - P.tauZone;
    if (d.kind === 'under') {
      let best = null, bd = 1e9, near = null, nd = 1e9;
      for (const id of ELIG) {
        const pd = posAt(st.tls[id], td);
        if (d.patient) {
          const pv = posAt(st.tls[id], td - 0.15);
          const onStem = (pd[1] - pv[1]) / 0.15 > 3 && Math.abs(pd[0] - pv[0]) / 0.15 < 1.2;
          if (onStem && Math.hypot(pd[0] - d.x, pd[1] - d.y) > 2) continue;
        }
        const dd = Math.hypot(pd[0] - d.x, pd[1] - d.y) - (d.cur === id ? 1.5 : 0);
        if (inBox(d.box, pd[0], pd[1], 0.5)) { if (dd < bd) { bd = dd; best = id; } }
        else if (inBox(d.box, pd[0], pd[1], 1.5)) { if (dd < nd) { nd = dd; near = id; } }
      }
      let tx = d.lm[0], ty = d.lm[1];
      const pick = best || near;
      d.cur = best;
      if (pick) {
        const pd = posAt(st.tls[pick], td);
        tx = clamp(pd[0], d.box.x0 + 0.5, d.box.x1 - 0.5);
        ty = clamp(pd[1] + 0.6, 1.5, d.box.y1);
      }
      moveTo(d, tx, ty, P.zone, dt);
      return;
    }
    // deep zone
    const th = [];
    for (const id of ELIG) {
      const tl = st.tls[id];
      const pd = posAt(tl, td);
      if (pd[0] < d.box.x0 - 1 || pd[0] > d.box.x1 + 1 || pd[1] < 4) continue;
      let vy = (pd[1] - posAt(tl, td - 0.15)[1]) / 0.15;
      if (d.stick && vy <= 1.0) vy = (posAt(tl, td - d.stick)[1] - posAt(tl, td - d.stick - 0.15)[1]) / 0.15;
      if (vy > 1.0 || pd[1] >= d.y - 1) th.push(pd);
    }
    th.sort((a, b) => b[1] - a[1]);
    const base = homeY(d) + Math.min(t * 2.2, d.dropMax || 2.5);
    // Cover 2 safeties start in the middle of their half and only get over the top late,
    // which is what leaves the sideline hole open early.
    const gain = d.late ? lerp(d.gain, d.late, clamp((t - 2.2) / 1.3, 0, 1)) : d.gain;
    let tx, ty = base;
    if (!th.length) {
      tx = d.lm[0] + (d.roam ? d.favor * d.roam * Math.min(1, t / 1.5) : 0);
    } else if (th.length === 1) {
      tx = lerp(d.lm[0], th[0][0], gain);
      ty = Math.max(base, th[0][1] + P.deepCush);
    } else {
      // two or more threats: lean toward one of the two deepest
      const a = th[0], b = th[1];
      const fav = (d.favor < 0 ? (a[0] < b[0] ? a : b) : (a[0] > b[0] ? a : b));
      const oth = fav === a ? b : a;
      const fx = lerp(d.lm[0], fav[0], gain), ox = lerp(d.lm[0], oth[0], gain);
      tx = fx * d.fw + ox * (1 - d.fw);
      ty = Math.max(base, a[1] + P.deepCush);
    }
    tx = clamp(tx, d.box.x0 + 1, d.box.x1 - 1);
    ty = Math.max(ty, d.y - 0.01); // deep defenders never drift back toward the line on their own
    moveTo(d, tx, Math.min(ty, Y_MAX + 2), P.def, dt);
  }

  /* ---------- Simulation ---------- */
  function qbPos(st, t) { return posAt(st.qbTl, t === undefined ? st.t : t); }
  function recPos(st, id, t) { return posAt(st.tls[id], t === undefined ? st.t : t); }

  function step(st, dt) {
    if (st.result) return;
    st.t += dt;
    const t = st.t, qb = qbPos(st, t);
    for (const d of st.defs) moveDef(st, d, t, dt, qb);
    if (st.ball) {
      const b = st.ball, s = (t - b.t0) / b.dur;
      const bp = [lerp(b.from[0], b.to[0], Math.min(s, 1)), lerp(b.from[1], b.to[1], Math.min(s, 1))];
      b.pos = bp; b.s = Math.min(s, 1);
      // a defender can only tip the ball where its arc is within reach
      const lift = Math.sin(Math.PI * b.s) * Math.min(b.dist, 26) * 0.22;
      const low = s > 0.2 && s < 0.9 && lift <= P.tipReach;
      if (low) {
        for (const d of st.defs) {
          if (d.kind === 'rush') continue;
          if (Math.hypot(d.x - bp[0], d.y - bp[1]) < 0.7) {
            st.result = { type: 'tipped', by: d.id, t, target: b.target, sep: 0, yards: 0, at: bp };
            return;
          }
        }
      }
      if (s >= 1) resolveCatch(st);
    } else {
      const r = st.defs.find((d) => d.kind === 'rush');
      if (Math.hypot(r.x - qb[0], r.y - qb[1]) < 0.9) st.result = { type: 'sack', t, yards: 0 };
    }
  }

  function throwTo(st, id) {
    if (st.ball || st.result) return false;
    const qb = qbPos(st);
    let tf = 0.6, c = recPos(st, id, st.t + tf), d0 = dist(qb, c);
    for (let k = 0; k < 8; k++) {
      c = recPos(st, id, st.t + tf);
      d0 = dist(qb, c);
      tf = Math.max(0.3, d0 / P.ball * (1 + Math.max(0, d0 - 14) * 0.012));
    }
    st.ball = { target: id, from: qb.slice(), to: c.slice(), t0: st.t, dur: tf, dist: d0, pos: qb.slice(), s: 0 };
    st.thrownAt = st.t;
    return true;
  }

  function resolveCatch(st) {
    const b = st.ball, c = b.to;
    if (b.dist > P.maxThrow) { st.result = { type: 'short', t: st.t, target: b.target, sep: 0, yards: 0, at: c }; return; }
    const tlT = st.tls[b.target];
    if (st.t < tlT.readyT - P.earlySlack) {
      st.result = { type: 'early', t: st.t, target: b.target, sep: 0, yards: 0, at: c.slice() }; return;
    }
    let sep = 1e9, by = null;
    for (const d of st.defs) {
      if (d.kind === 'rush') continue;
      const dd = Math.hypot(d.x - c[0], d.y - c[1]);
      if (dd < sep) { sep = dd; by = d.id; }
    }
    let type = 'complete';
    if (sep < P.pickSep) type = 'intercept'; else if (sep < P.openSep) type = 'incomplete';
    let yards = 0;
    if (type === 'complete') {
      const tl = st.tls[b.target];
      const moving = st.t > tl.delay && st.t < tl.tEnd - 0.05;
      const yac = clamp((sep - P.openSep) * 0.9, 0, 6) + (moving ? 1 : 0);
      yards = Math.round(c[1] + yac);
    }
    st.result = { type, t: st.t, target: b.target, sep, by, yards, at: c.slice() };
  }

  function run(st, until) {
    let guard = 0;
    while (!st.result && st.t < until && guard++ < 5000) step(st, DT);

  }

  /* Try every receiver at every tenth of a second. Used for the replay, the hint and the test harness. */
  function analyze(playId, covId, seed, opts) {

    const out = {};
    ELIG.forEach((id) => { out[id] = { samples: [], windows: [], best: null }; });
    let sackT = null;
    const stride = Math.round(0.1 / DT);
    for (let tick = 0; tick < 900; tick++) {
      if (tick) step(base, DT);
      if (base.result) { sackT = base.result.t; break; }
      if (tick % stride) continue;
      const t0 = (tick / stride) / 10;
      for (const id of ELIG) {
        const c = cloneRep(base);
        throwTo(c, id);
        run(c, c.t + 6);
        const r = c.result || { type: 'incomplete', sep: 0, yards: 0 };
        out[id].samples.push({ t: t0, type: r.type, sep: r.sep, yards: r.yards });
      }
    }
    for (const id of ELIG) {
      const o = out[id];
      let cur = null;
      for (const s of o.samples) {
        if (s.type === 'complete') {
          if (!cur) { cur = { t0: s.t, t1: s.t, yards: s.yards, sep: s.sep }; o.windows.push(cur); }
          cur.t1 = s.t; cur.yards = Math.max(cur.yards, s.yards); cur.sep = Math.max(cur.sep, s.sep);
        } else cur = null;
      }
      o.open = o.windows.some((w) => Math.round((w.t1 - w.t0) * 10) >= 4);
      o.best = o.windows.reduce((a, w) => (!a || w.yards > a.yards ? w : a), null);
    }
    return { by: out, sackT };
  }

  return { P, DT, HALF_W, Y_MAX, ELIG, FORMATIONS, FORM_ORDER, PLAYS, PLAY_BY_ID, COVERAGES, COV_ORDER, PARTNER, R,
    createRep, cloneRep, step, run, throwTo, analyze, posAt, qbPos, recPos, makeTimeline, mulberry32 };
})();

<script>

      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.strokeText(o.tag, x, y - r - 5); ctx.fillStyle = o.tagColor || C.flag; ctx.fillText(o.tag, x, y - r - 5);
    }
  }
  function drawZones(ctx, v, rep) {
    ctx.save();
    for (const d of rep.defs) {
      if (d.kind === 'man') {
        const p = E.recPos(rep, d.man);
        ctx.strokeStyle = 'rgba(255,210,63,.75)'; ctx.lineWidth = Math.max(1.5, v.s * 0.16); ctx.setLineDash([v.s * 0.45, v.s * 0.4]);
        ctx.beginPath(); ctx.moveTo(v.X(d.x), v.Y(d.y)); ctx.lineTo(v.X(p[0]), v.Y(p[1])); ctx.stroke(); ctx.setLineDash([]);
        continue;
      }
      if (!d.box || d.free) continue;
      const b = d.box, deep = d.kind === 'deep';
      const y0 = Math.max(b.y0 === undefined ? v.yMin : b.y0, 0), y1 = Math.min(b.y1 === undefined ? GOAL : b.y1, v.yMax);
      const x0 = v.X(Math.max(b.x0, -20)), x1 = v.X(Math.min(b.x1, 20));
      ctx.fillStyle = deep ? 'rgba(120,170,255,.13)' : 'rgba(255,170,90,.16)';
      ctx.strokeStyle = deep ? 'rgba(160,200,255,.7)' : 'rgba(255,190,120,.7)';
      ctx.lineWidth = 1.2;
      ctx.fillRect(x0 + 2, v.Y(y1) + 2, x1 - x0 - 4, v.Y(y0) - v.Y(y1) - 4);
      ctx.strokeRect(x0 + 2, v.Y(y1) + 2, x1 - x0 - 4, v.Y(y0) - v.Y(y1) - 4);

  }
  function drawBall(ctx, v, b) {
    const lift = Math.sin(Math.PI * b.s) * Math.min(b.dist, 26) * 0.22 * v.s;
    const x = v.X(b.pos[0]), y = v.Y(b.pos[1]);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x, y, v.s * 0.5, v.s * 0.3, 0, 0, 7); ctx.fill();
    const ang = Math.atan2(-(b.to[1] - b.from[1]), b.to[0] - b.from[0]);
    ctx.save(); ctx.translate(x, y - lift); ctx.rotate(ang);
    const k = 1 + Math.sin(Math.PI * b.s) * 0.35;
    ctx.fillStyle = C.ball; ctx.strokeStyle = C.chalk; ctx.lineWidth = Math.max(1, v.s * 0.1);
    ctx.beginPath(); ctx.ellipse(0, 0, Math.max(6, v.s * 0.8) * k, Math.max(3.6, v.s * 0.46) * k, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-v.s * 0.3 * k, 0); ctx.lineTo(v.s * 0.3 * k, 0); ctx.stroke();
    ctx.restore();
  }

  /* scene: { rep, routes (0..1), hot:[ids] (home demo only), alt:{id: timeline} (second option of an option route), labels, zones,
              rings:{id:color}, tags:{id:text}, defTags, band,
              watch:[defender ids] ringed, watchTag (default WATCH HIM), watchQuiet (faint ring, no tag),
              mark:{y, side} (a faint line across one side of the field), faceQB (every defender's eyes on the quarterback) }
     drawScene fills sc.drawn with what it actually lit up: hot routes, receiver rings and tags, ringed defenders and their tags. */
  function drawScene(ctx, v, sc) {
    const rep = sc.rep, t = rep.t, out = sc.drawn = { hot: [], recRings: [], recTags: [], watch: [], watchTags: [], quiet: !!sc.watchQuiet, mark: null };
    drawTurf(ctx, v, sc.plain);
    if (sc.band) drawBand(ctx, v, sc.band);
    if (sc.zones) drawZones(ctx, v, rep);
    if (sc.mark) {
      const m = sc.mark, x0 = v.X(m.side * 20), x1 = v.X(0), y = v.Y(m.y);
      ctx.save(); ctx.strokeStyle = 'rgba(255, 210, 63, .6)'; ctx.lineWidth = Math.max(1.5, v.s * 0.18); ctx.setLineDash([v.s * 0.7, v.s * 0.6]);
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.restore();
      out.mark = m;
    }
    if (sc.routes > 0 || (sc.hot && sc.hot.length)) drawRoutes(ctx, v, rep, sc.routes || 0, sc.hot, sc.alt, out);
    const qb = E.qbPos(rep, t);
    // facing wedge: his receiver in man (unless the look is hidden), else the ball or the quarterback
    const faceOf = (d) => (d.kind === 'man' && !sc.faceQB ? E.recPos(rep, d.man, t) : d.kind !== 'rush' ? (rep.ball ? rep.ball.to : qb) : null);
    if (!sc.noDef) {
      // drawn left to right whatever order the coverage built them in: a hidden look must not differ by one overlapping pixel
      for (const d of rep.defs.slice().sort((a, b) => a.x - b.x || a.y - b.y || (a.lab < b.lab ? -1 : a.lab > b.lab ? 1 : 0))) {
        let tag = null; const face = faceOf(d);
        if (sc.defTags) {
          if (d.kind === 'rush') tag = 'RUSHER';
          else if (d.lab === 'S') tag = 'SAFETY';
          else if (d.lab === 'CB') tag = 'CORNER';
        }
        const watched = sc.watch && sc.watch.indexOf(d.id) >= 0, quiet = watched && sc.watchQuiet;
        if (watched) {
          ctx.save(); ctx.globalAlpha = quiet ? 0.4 : 1;
          ctx.beginPath(); ctx.arc(v.X(d.x), v.Y(d.y), tokR(v) * 1.75, 0, 7); ctx.strokeStyle = C.flag; ctx.lineWidth = Math.max(2.5, v.s * 0.3); ctx.setLineDash([v.s * 0.5, v.s * 0.4]); ctx.stroke();
          ctx.restore();
          out.watch.push(d.id);
          if (!quiet) { tag = sc.watchTag || 'WATCH HIM'; out.watchTags.push(tag); }
        }
        drawDef(ctx, v, d, face, { label: sc.labels, tag, tagColor: (watched && !quiet) || d.lab === 'S' ? C.flag : C.chalk, edge: (sc.defTags && d.lab === 'S') || (watched && !quiet) ? C.flag : null });
      }
    }
    drawOff(ctx, v, rep.pos.C, 'C', { square: true, fill: '#cfd6cc' });
    if (!rep.ball && !(rep.result && rep.result.type !== 'sack')) drawOff(ctx, v, qb, 'QB', { fill: C.chalk, ring: sc.qbRing });
    else drawOff(ctx, v, qb, 'QB');
    for (const id of E.ELIG) {
      const p = E.recPos(rep, id, t), ring = sc.rings && sc.rings[id], tag = sc.tags && sc.tags[id];
      if (ring) out.recRings.push(id);
      if (tag) out.recTags.push(id);
      drawOff(ctx, v, p, id, { ring, tag });
    }
    // the defender he is told to watch stays on top while the ring is bright, so a receiver running past cannot hide him
    if (!sc.noDef && sc.watch && !sc.watchQuiet) rep.defs.forEach((d) => { if (sc.watch.indexOf(d.id) >= 0) drawDef(ctx, v, d, faceOf(d), { label: sc.labels, tag: sc.watchTag || 'WATCH HIM', tagColor: C.flag, edge: C.flag }); });
    if (rep.ball && !(rep.result && rep.result.type === 'complete')) drawBall(ctx, v, rep.ball);
    if (rep.result && rep.result.at) {
      const a = rep.result.at, good = rep.result.type === 'complete';
      ctx.beginPath(); ctx.arc(v.X(a[0]), v.Y(a[1]), tokR(v) * 2.1, 0, 7); ctx.strokeStyle = good ? C.flag : C.bad; ctx.lineWidth = Math.max(2.5, v.s * 0.3); ctx.stroke();
    }
  }

  /* ---------- coach voice: recorded clips, one per sentence, packed end to end in a few files saved for offline play ----------
     window.__VOICE = { files: ['coach.mp3', 'coach-2.mp3', ...], idx: { sentence key: [file, offset, length] } }
     (a key is the sentence in lower-case letters and digits only).
     A sentence with no clip is simply not spoken; the same words are always on screen. */
  const Voice = (function () {
    const V = window.__VOICE || null, IDX = V ? V.idx : null, FILES = V ? V.files : [], cache = {}, said = {};
    let packs = null, loading = null, cur = null, token = 0;
    const key = (t) => t.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
    const clean = (t) => String(t).replace(/<[^>]+>/g, ' ').replace(/&amp;/g, 'and').replace(/\s+/g, ' ').trim();
    function load() {
      if (!IDX) return Promise.resolve(null);
      if (!loading) loading = Promise.all(FILES.map((f) => fetch(f).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null))).then((bs) => { packs = bs; return bs; });
      return loading;
    }
    function buffer(k) {
      if (cache[k]) return Promise.resolve(cache[k]);
      const c = Sound.ctx(), at = IDX[k];
      const pack = packs && at ? packs[at[0]] : null;
      if (!c || !pack || !at) return Promise.resolve(null);
      return new Promise((res) => { try { c.decodeAudioData(pack.slice(at[1], at[1] + at[2]), (buf) => { cache[k] = buf; res(buf); }, () => res(null)); } catch (e) { res(null); } });
    }
    function stop() { token++; if (cur) { try { cur.onended = null; cur.stop(); } catch (e) { /* already ended */ } cur = null; } }
    const split = (text) => (clean(text).match(/[^.!?]+[.!?]+/g) || [clean(text)]).map(key).filter(Boolean);
    // will this text be heard? true only when the coach's voice is on and every sentence of it has a clip
    function hears(text) { const ks = split(text); return !!(IDX && save.voice && ks.length && ks.every((k) => IDX[k])); }
    // say(text, done): done(n) runs when the last clip has finished (n = clips actually played; 0 when nothing could be heard).
    // A sentence without a clip is dropped before the chain starts, so it cannot stall or reorder the others.
    // done never runs if another say() or stop() cuts this one off.
    function say(text, done) {
      const fin = (n) => { if (done) done(n); };
      if (!text) { fin(0); return; }
      const keys = split(text);
      keys.forEach((k) => { said[k] = 1; });
      if (!IDX || !save.voice) { fin(0); return; }
      const have = keys.filter((k) => IDX[k]); if (!have.length) { fin(0); return; }
      stop(); const mine = token; let i = 0, n = 0;
      const next = () => {
        if (mine !== token) return;
        if (i >= have.length) { fin(n); return; }
        buffer(have[i++]).then((buf) => {
          if (mine !== token) return;
          const c = Sound.ctx(); if (!buf || !c) { next(); return; }
          const src = c.createBufferSource(), g = c.createGain(); src.buffer = buf; g.gain.value = 1;
          src.connect(g).connect(c.destination); src.onended = () => { if (cur === src) cur = null; setTimeout(next, 110); };
          cur = src; src.start(); n++;
        });
      };
      load().then(next);
    }
    if (IDX) setTimeout(load, 1500);      // fetch the clips shortly after launch so the first line is not late
    return { say, stop, hears, ok: !!IDX, said, cache };
  })();

  /* ---------- progress: unlocks, mastery, trophies, records, gear ---------- */
  const START_PLAYS = ['d-smash', 'd-hitch', 'd-comeback', 'd-slant-wheel'];

    const add = (id) => { if (!seen[id]) { seen[id] = 1; out.push(id); } };

    levelAt: { rookie: 0, starter: 90, allpro: 240 } };   // about 3 and 7 games in for that same player
  const unlockAt = (k) => TUNE.unlockAt[Math.min(k, TUNE.unlockAt.length) - 1];   // stars needed for the k-th extra play
  function unlockedExtra() { if (save.unlockAll) return UNLOCK_ORDER.length; let k = 0; while (k < UNLOCK_ORDER.length && save.total >= unlockAt(k + 1)) k++; return k; }
  function isUnlocked(id) { return save.unlockAll || START_PLAYS.indexOf(id) >= 0 || UNLOCK_ORDER.indexOf(id) < unlockedExtra(); }
  function playsOwned() { return START_PLAYS.length + unlockedExtra(); }
  function levelOpen(id) { return save.unlockAll || save.total >= TUNE.levelAt[id]; }
  function poolFor(L) { const p = L.pool.filter(isUnlocked); return p.length ? p : START_PLAYS.slice(); }
  function playName(id) { const p = E.PLAY_BY_ID[id]; return E.FORMATIONS[p.form].name + ' ' + p.name; }

  const TROPHIES = [

    { id: 'camp', name: 'Defense Reader', how: 'Finish all of Read the Defense' },   // id stays 'camp': saved trophies keep working
    { id: 'hot5', name: 'Hot Hand', how: '5 coach’s reads in a row' },
    { id: 'hot10', name: 'On Fire', how: '10 coach’s reads in a row' },
    { id: 'perf10', name: 'Triple Star', how: 'Ten 3-star plays' },

    { id: 'c1', name: 'Man Beater', how: 'Beat Cover 1 ten times' },
    { id: 'c2', name: 'Two-Deep Buster', how: 'Beat Cover 2 ten times' },
    { id: 'c3', name: 'Three-Deep Buster', how: 'Beat Cover 3 ten times' },
    { id: 'c4', name: 'Four-Deep Buster', how: 'Beat Cover 4 ten times' },
    { id: 'master', name: 'Play Master', how: 'Beat all four defenses with one play' },
    { id: 'book10', name: 'Thick Playbook', how: 'Own 10 plays' },
    { id: 'gold', name: 'Gold Game', how: 'Earn a gold medal' },
    { id: 'clean', name: 'Clean Game', how: 'A game with no flag pulls and no picks' },
