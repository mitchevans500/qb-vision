  const TROPHY = {}; TROPHIES.forEach((t) => { TROPHY[t.id] = t; });

  // gear: looks only. Each piece names what unlocks it: a star total (at) or a trophy.
  const GEAR = {
    field: [
      { id: 'night', name: 'Night Game', at: 0, turfA: '#2c7d48', turfB: '#267341', endA: '#1d5c37' },
      { id: 'day', name: 'Sunny Day', at: 45, turfA: '#4a9e58', turfB: '#43934f', endA: '#2c7443' },
      { id: 'sunset', name: 'Sunset', at: 110, turfA: '#7a8a3c', turfB: '#718035', endA: '#8c5530' },
      { id: 'snow', name: 'Snow Bowl', at: 190, turfA: '#6f8fa3', turfB: '#668498', endA: '#3f5f78' },
    ],
    trail: [
      { id: 'none', name: 'No trail', at: 0 },
      { id: 'comet', name: 'Comet', trophy: 'td1', colors: ['#ffffff', '#bfe6ff'] },
      { id: 'fire', name: 'Fire', trophy: 'hot5', colors: ['#ffd23f', '#ff8a3d', '#ff5a36'] },
      { id: 'rainbow', name: 'Rainbow', trophy: 'master', colors: ['#ff6b6b', '#ffd23f', '#7be38f', '#6bc1ff', '#c59bff'] },
      { id: 'gold', name: 'Gold Dust', trophy: 'gold', colors: ['#ffe08a', '#ffd23f', '#fff4c9'] },
    ],
    name: [
      { id: 'you', name: 'You', at: 0 }, { id: 'thunder', name: 'Thunder', at: 0 }, { id: 'rockets', name: 'Rockets', at: 0 }, { id: 'wildcats', name: 'Wildcats', at: 0 },
      { id: 'sharks', name: 'Sharks', at: 0 }, { id: 'dragons', name: 'Dragons', at: 0 }, { id: 'comets', name: 'Comets', at: 0 },
    ],
    team: [
      { id: 'chalk', name: 'Chalk', at: 0, fill: '#f3f0e5' },
      { id: 'sky', name: 'Sky', at: 20, fill: '#a9d8ff' },
      { id: 'mint', name: 'Mint', at: 70, fill: '#a8f0c2' },
      { id: 'flame', name: 'Flame', at: 140, fill: '#ffb891' },
      { id: 'grape', name: 'Grape', trophy: 'camp', fill: '#d9c2ff' },
    ],
  };
  function gearOpen(g) { return save.unlockAll || (g.trophy ? !!save.trophies[g.trophy] : save.total >= (g.at || 0)); }
  function gearNeed(g) { return g.trophy ? 'Trophy: ' + TROPHY[g.trophy].name : g.at + ' ★'; }
  function gearOn(kind) { const list = GEAR[kind]; const g = list.find((x) => x.id === save.gear[kind]); return g && gearOpen(g) ? g : list[0]; }
  function applyGear() { const f = gearOn('field'); C.turfA = f.turfA; C.turfB = f.turfB; C.endA = f.endA; C.team = gearOn('team').fill; }

  /* ---------- toasts and field effects ---------- */
  const toastQ = []; let toastBusy = false;
  function toast(html, cls) { toastQ.push([html, cls || '']); if (!toastBusy) nextToast(); }
  function nextToast() {
    const box = document.getElementById('toasts'); const t = toastQ.shift();
    if (!t || !box) { toastBusy = false; return; }
    toastBusy = true;
    const n = el('div', 'toast ' + t[1], t[0]); box.appendChild(n);
    requestAnimationFrame(() => n.classList.add('on'));
    setTimeout(() => { n.classList.remove('on'); setTimeout(() => { n.remove(); nextToast(); }, 260); }, 2300);
  }
  const FX = { parts: [], trail: [] };
  const calm = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function confetti(n, colors) {
    if (calm() || !fieldView) return;
    const W = fieldView.W;
    for (let i = 0; i < n; i++) FX.parts.push({ x: Math.random() * W, y: -10 - Math.random() * 60, vx: (Math.random() - 0.5) * 90, vy: 90 + Math.random() * 160, r: 3 + Math.random() * 4, c: colors[i % colors.length], life: 2.6, spin: Math.random() * 6 });
  }
  function stepFx(dt) {
    for (const p of FX.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.spin += dt * 6; p.life -= dt; }
    FX.parts = FX.parts.filter((p) => p.life > 0);
    for (const t of FX.trail) t.life -= dt;
    FX.trail = FX.trail.filter((t) => t.life > 0);
  }
  function drawFx(ctx) {
    for (const t of FX.trail) { ctx.globalAlpha = Math.max(0, t.life / 0.5) * 0.85; ctx.fillStyle = t.c; ctx.beginPath(); ctx.arc(t.x, t.y, t.r * (0.4 + t.life), 0, 7); ctx.fill(); }
    for (const p of FX.parts) { ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin); ctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); ctx.restore(); }
    ctx.globalAlpha = 1;
  }
  const PARTY = ['#ffd23f', '#f3f0e5', '#7be38f', '#6bc1ff', '#ff8068'];

  /* ---------- awarding ---------- */
  function award(id) {
    if (save.trophies[id] || !TROPHY[id]) return false;
    save.trophies[id] = Date.now();
    toast(`<b>Trophy!</b> ${TROPHY[id].name}`, 'gold'); Sound.td();
    return true;
  }
  // add stars, then announce anything that just opened: plays, levels, gear
  function addStars(n) {
    const before = { k: unlockedExtra(), lv: LEVEL_ORDER.filter(levelOpen), gear: openGearIds() };
    save.total += n;
    announceUnlocks(before);
  }
  function openGearIds() { const out = {}; Object.keys(GEAR).forEach((k) => GEAR[k].forEach((g) => { if (gearOpen(g)) out[k + ':' + g.id] = 1; })); return out; }
  function announceUnlocks(before) {
    const k = unlockedExtra();
    for (let i = before.k; i < k; i++) { toast(`<b>New play!</b> ${playName(UNLOCK_ORDER[i])}`, 'new'); if (G.game) (G.game.fresh = G.game.fresh || []).push(UNLOCK_ORDER[i]); }
    LEVEL_ORDER.forEach((id) => { if (levelOpen(id) && before.lv.indexOf(id) < 0) toast(`<b>${LEVELS[id].name}</b> level is open!`, 'new'); });
    const now = openGearIds();
    Object.keys(now).forEach((key) => { if (!before.gear[key]) { const [kind, id] = key.split(':'); toast(`<b>New gear!</b> ${GEAR[kind].find((g) => g.id === id).name}`, 'new'); } });
    if (playsOwned() >= 10) award('book10');
  }
  function nextGoal() {
    const k = unlockedExtra();
    if (k < UNLOCK_ORDER.length) return { at: unlockAt(k + 1), from: k ? unlockAt(k) : 0, label: playName(UNLOCK_ORDER[k]), id: UNLOCK_ORDER[k] };
    return null;
  }
  // called once per finished play (practice or game); returns what was earned for the result screen
  function recordRep(res, cov, playId, repeat) {
    const before = { k: unlockedExtra(), lv: LEVEL_ORDER.filter(levelOpen), gear: openGearIds() };
    const st = save.stat;
    if (!repeat) save.total += res.stars;
    st.plays = (st.plays || 0) + 1;
    if (res.stars === 3) st.perfect = (st.perfect || 0) + 1;
    if (res.td) st.tds = (st.tds || 0) + 1;
    if (res.smart) {
      save.streak = (save.streak || 0) + 1;
      save.best.streak = Math.max(save.best.streak || 0, save.streak);
      st['beat' + cov] = (st['beat' + cov] || 0) + 1;
      const pp = save.pips[playId] || (save.pips[playId] = {});
      res.newPip = !pp[cov]; pp[cov] = 1;
      if (E.COV_ORDER.every((c) => pp[c])) award('master');
    } else save.streak = 0;
    if (res.td) award('td1');
    if (res.complete && res.yards >= 20) award('bomb');
    if (save.streak >= 5) award('hot5');
    if (save.streak >= 10) award('hot10');
    if ((st.perfect || 0) >= 10) award('perf10');
    if (res.smart) { st.smart = (st.smart || 0) + 1; if (st.smart >= 100) award('fav'); }
    ['C1', 'C2', 'C3', 'C4'].forEach((c) => { if ((st['beat' + c] || 0) >= 10) award(c.toLowerCase()); });
    announceUnlocks(before);
    persist();
  }
  /* ---------- v3: the key. Who to watch before the snap, and what each thing he can do means ----------
     Every coaching word comes from Reads (keyParts, cardFor, keySay, didLine, branchFor, disguise); this file only lays
     them out and times them. Short labels ("WATCH", "either way") are the only words added here. */
  TUNE.key = {
    hikeQuiet: 6,     // s: HIKE waits this long after the card appears when the coach cannot say the key (no clip, or Coach off)
    hikeSeen: 2,      // s: ...and only this long once he has seen this play's card `seenTimes` times (counted per play, saved)
    seenTimes: 2,
    speechCap: 15,    // s: HIKE opens by now even if the spoken key never finishes (sound blocked)
    slowFor: 0.6,     // s of PLAY time after the snap that run slow on Rookie; receivers cannot be thrown to yet.
                      //   0.6, not 1.0: at 1.0 the quick throws (arrow vs man, vertical behind a short corner) close before he may throw
    slowRate: 0.4,    // the share of the level's speed during that time
    slowEase: 0.4,    // s of play time to ease back up to full speed (no jump)
    markYards: 7,     // the faint line across the watched corner's side while the ring is bright: in front = stays short, past = backs up
  };
  const keyOf = (playId) => RD.keyParts(playId);
  // the disguise for this look on this level (only plays with a key defender, only levels that hide), or null = honest
  function disguiseOf(playId, cov, L) { return L.disguise ? RD.disguise(playId, cov) : null; }
  // the pre-snap question, step by step: only the honest part when the look is disguised
  function askFor(L, dz) { return dz ? [dz.ask] : L.call === 'both' ? ['deep', 'corners'] : [L.call]; }
  // the card for this look: the branches for this coverage and its partner (Reads.cardFor), in order.
  // When both mean the same throw, one row: "either way".
  function cardRows(playId, cov) {
    const rows = RD.cardFor(playId, cov);
    if (rows.length > 1 && rows.every((b) => b.then === rows[0].then)) return [{ did: 'either way', then: rows[0].then }];
    return rows.map((b) => ({ did: b.did, then: b.then }));
  }
  // a receiver's letter looks like his token on the field (same for every row, so no row stands out)
  const recChip = (t) => String(t).replace(/\b(R1|X|H|Y|Z)\b/g, '<b class="rc">$1</b>');
  function keyCard(playId, cov, small) {
    const kp = keyOf(playId), cls = 'keycard' + (small ? ' small' : '');
    if (!kp.family) return el('div', cls + ' plain', `<p class="kc-text">${recChip(kp.text)}</p>`);
    const rows = cardRows(playId, cov).map((r) => `<div class="kc-row"><span class="kc-did">${r.did}</span><span class="kc-arrow" aria-hidden="true">→</span><span class="kc-then">${recChip(r.then)}</span></div>`).join('');
    return el('div', cls, `<p class="kc-head"><span class="kc-lab">Watch</span> <span class="kc-who">${recChip(kp.who)}</span></p><div class="kc-rows">${rows}</div>`);
  }

  // what the answered question tells him, said and shown (only what he was asked: no coverage name on a hidden look)
  function tellOf(c, ask) {
    if (ask.length === 1 && ask[0] === 'deep') return { say: `${c.deep === 1 ? 'One' : 'Two'} deep.`, show: `${c.deep === 1 ? 'One' : 'Two'} deep.` };
    if (ask.length === 1 && ask[0] === 'corners') return { say: c.corners === 'up' ? 'Up close.' : 'Backed off.', show: `Corners ${c.corners === 'up' ? 'up close' : 'backed off'}.` };
    return { say: `${c.name}.`, show: factLine(c), cov: c.name };
  }
  // after the play
  const showedLine = (dz, c) => `They showed ${dz.family === 'safety' || c.deep === 2 ? 'two' : 'one'} deep.`;   // a hidden safety count always shows the two-deep shell
  const wasLine = (c) => `It was ${c.name}.`;
  function didThen(playId, cov) {
    const d = RD.didLine(playId, cov), b = RD.branchFor(playId, cov);
    return d && b ? `${d.replace(/\.$/, '')} → ${b.then}.` : '';
  }

  // Disguised looks: a receiver whose route depends on the hidden half (an option route reads the corner) would give the
  // answer away if only his real route were drawn. Draw both of his options until the play is over.
  function altRoutes(playId, cov, seed, eo, dz) {
    if (!dz) return null;
    const a = E.createRep(playId, cov, seed, eo), b = E.createRep(playId, dz.partner, seed, eo), out = {};
    E.ELIG.forEach((id) => { if (JSON.stringify(a.tls[id].pts) !== JSON.stringify(b.tls[id].pts)) out[id] = b.tls[id]; });
    return Object.keys(out).length ? out : null;
  }

  /* HIKE waits until he has had time to take in the key:
       the spoken key has finished (every sentence of it has a clip and Coach is on), or
       hikeQuiet seconds when it cannot be heard, or
       hikeSeen seconds once he has seen this play's card seenTimes times.
     Levels without a card (All-Pro) do not wait. Wall-clock seconds, sped up only by the test knob TUNE.fast. */
  function armHike(L, keyText) {
    const T = TUNE.key;
    G.readyAt = performance.now();
    G.gate = { wait: 0, speech: false, done: false };
    if (L.hint !== 'key') return;
    const seen = save.cardSeen[G.playId] || 0;
    save.cardSeen[G.playId] = seen + 1; persist();
    if (seen >= T.seenTimes) G.gate.wait = T.hikeSeen;
    else if (Voice.hears(keyText)) G.gate.speech = true;
    else G.gate.wait = T.hikeQuiet;
  }
  // the coach's ready line finished: n = clips that played (0 = nothing was heard, so fall back to reading time)
  function spokeKey(gate, n) { if (G.gate !== gate || !gate.speech) return; if (n) gate.done = true; else { gate.speech = false; gate.wait = TUNE.key.hikeQuiet; } }
  function readySecs() { return (performance.now() - (G.readyAt || 0)) * (TUNE.fast || 1) / 1000; }
  function hikeOpen() {
    if (G.phase !== 'ready') return false;
    const g = G.gate; if (!g) return true;
    const t = readySecs();
    return g.speech ? g.done || t >= TUNE.key.speechCap : t >= g.wait;
  }
  // called every frame while the HIKE button is up: enable it, and fill it as the wait runs out
  function syncHike() {
    const b = document.getElementById('hikeBtn'); if (!b) return;
    const open = hikeOpen();
    if (b.disabled === open) b.disabled = !open;
    const f = b.querySelector('.hk-fill'), g = G.gate;
    if (f) f.style.transform = `scaleX(${open ? 1 : g && !g.speech && g.wait ? clamp(readySecs() / g.wait, 0, 1) : 0})`;
  }

  /* Rookie, after the snap: the first slowFor seconds of play time run at slowRate, then ease back over slowEase. */
  function slowRate(t) {
    const L = lvl(), T = TUNE.key;
    if (!L.slow) return 1;
    if (t < T.slowFor) return T.slowRate;
    if (t < T.slowFor + T.slowEase) return T.slowRate + (1 - T.slowRate) * (t - T.slowFor) / T.slowEase;
    return 1;
  }
  // the slow window: watch first, no throwing yet
  const watching = () => !!(lvl().slow && G.rep && (G.phase === 'live') && G.rep.t < TUNE.key.slowFor);
  // keep the live panel in step with the slow window (receivers wake up when it ends)
  function syncLive() {
    const r = document.querySelector('#panel .recv'); if (!r) return;
    const w = watching();
    if (r.classList.contains('wait') !== w) {
      r.classList.toggle('wait', w);
      const lab = document.getElementById('liveLab'); if (lab) lab.textContent = liveLabel();
    }
  }
  function liveLabel() {
    if (G.phase === 'ball') return 'Ball is in the air';
    if (G.phase !== 'live') return '\u00a0';
    if (!watching()) return 'Throw before the rusher gets you';
    const n = (G.keyIds || []).length;
    return n > 1 ? 'Watch them first' : n ? 'Watch him first' : 'Watch first';
  }
  /* ---------- picking a rep that has a right answer ---------- */
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // Everything one rep needs. dz = the disguise (null = honest look); eo = the engine options for EVERY rep built for this
  // look (the play, its analysis, the replay, "same defense"), so a disguised look stays disguised; br = the branch of the
  // key that comes true against this coverage.
  function buildRep(playId, cov, seed, L) {
    const dz = disguiseOf(playId, cov, L);
    const eo = dz ? { pressure: L.pressure, disguise: dz.family } : { pressure: L.pressure };
    const an = E.analyze(playId, cov, seed, eo);
    const rd = RD.forPlay(playId, cov), br = RD.branchFor(playId, cov);
    // usable: open, and on a slow-motion level still open after the first steps (no throwing during them)
    const usable = (id) => an.by[id].open && (!L.slow || an.by[id].windows.some((w) => w.t1 >= TUNE.key.slowFor + 0.3));
    const openTo = rd.to.filter((id) => an.by[id].open), named = br ? br.to : [];
    // 3 = the throw the card's true row names is usable, 2 = some coach's read is usable, 1 = one is open, 0 = none
    const rank = named.some(usable) || (!named.length && openTo.some(usable)) ? 3 : openTo.some(usable) ? 2 : openTo.length ? 1 : 0;
    return { cov, seed, an, rd, dz, eo, br, openTo, rank, pick1: named.filter(usable)[0] || openTo.filter(usable)[0] || openTo[0] || null };
  }
  // bias: coverages an opponent loves; they come up first more often than not
  function pickRep(playId, covSel, lvl, bias) {
    let covs = covSel === 'random' ? shuffle(E.COV_ORDER) : [covSel];
    if (covSel === 'random' && bias && bias.length && Math.random() < 0.6) { const f = bias[Math.floor(Math.random() * bias.length)]; covs = [f].concat(covs.filter((c) => c !== f)); }
    let best = null;
    // keep rolling looks until what the coach says is really true on the field; settle for less only after a fair try
    for (let i = 0; i < 28; i++) {
      const r = buildRep(playId, covs[i % covs.length], Math.floor(Math.random() * 2147483647), lvl);
      if (!best || r.rank > best.rank) best = r;
      if (best.rank >= (i < 12 ? 3 : i < 20 ? 2 : 1)) break;
    }
    return best;
  }
  const names = (ids) => ids.length <= 1 ? (ids[0] || '') : ids.slice(0, -1).join(', ') + ' or ' + ids[ids.length - 1];
  // the action sentence of a longer explanation: short enough to read at a glance and to say out loud
  function shortWhy(why) {
    const parts = (String(why).match(/[^.!?]+[.!?]+/g) || [String(why)]).map((x) => x.trim()).filter(Boolean);
    const act = parts.filter((p) => /throw|hit|find|look/i.test(p));
    return (act.length ? act[act.length - 1] : parts[parts.length - 1]) || '';
  }

  /* ---------- game state ---------- */
  const G = { mode: 'practice', playId: 'd-smash', covSel: 'random', phase: 'idle', rep: null, game: null, speed: null };
  let acc = 0, lastTs = 0, fieldView = null, fieldCtx = null;
  const cv = $('#field'), panel = $('#panel'), banner = $('#banner'), hud = $('#hud');
  const lvl = () => LEVELS[save.level];
  const DOWN = ['', '1st', '2nd', '3rd', '4th'];

  function setBanner(text, cls, sub) {
    if (!text) { banner.className = ''; return; }
    banner.innerHTML = text + (sub ? `<small>${sub}</small>` : '');
    banner.className = 'on ' + (cls || '');
  }
  function callQuestion() {
    const k = (G.ask || askFor(lvl(), null))[G.callStep];
    return k === 'name' ? 'What coverage is it?' : k === 'deep' ? 'How many safeties are deep?' : 'Where are the corners?';
  }
  function factLine(c) { return `${c.deep === 1 ? 'One' : 'Two'} deep, corners ${c.corners === 'up' ? 'up close' : 'backed off'}.`; }

  function startRep(playId, same) {
    if (playId) G.playId = playId;
    const L = lvl(), g = G.mode === 'game' ? G.game : null;
    const pick = same ? buildRep(G.playId, G.cov, G.seed, L) : pickRep(G.playId, G.covSel, L, g ? g.opp.fav : null);
    G.repeat = !!same;              // the very same look again: good practice, but it does not pay stars twice
    Object.assign(G, pick);
    G.rep = E.createRep(G.playId, G.cov, G.seed, G.eo);
    G.play = E.PLAY_BY_ID[G.playId];
    G.covInfo = E.COVERAGES[G.cov];
    G.kp = keyOf(G.playId);
    G.ask = askFor(L, G.dz);
    G.keyIds = watchIds(G.rep, G.kp.watch);                 // the defender(s) the key is about
    G.alt = altRoutes(G.playId, G.cov, G.seed, G.eo, G.dz);  // option routes that would give a hidden look away
    G.gate = null; G.rate = 1;
    G.phase = 'call'; G.callStep = 0; G.callAns = {}; G.callOK = null; G.thrown = null; G.rp = null; G.res = null; G.resultAt = 0;
    GOAL = g ? g.toGoal : 22; FIRST = g && !g.crossed && !g.xp ? g.toFirst : 0;
    acc = 0; FX.trail.length = 0;
    setBanner('');
    renderPanel(); renderHud();
    Voice.say(callQuestion());
  }

  // one sentence: what the defender does, so who is open
  function reason() { return G.rd.because || shortWhy(G.rd.why); }
  // ask = the question steps ('deep' | 'corners' | 'name'); every step has to be right
  function evalCall(ans, c, ask) { return ask.every((k) => (k === 'name' ? ans.name === c.id : ans[k] === c[k])); }
  function answerCall(val) {
    const L = lvl(), c = G.covInfo;
    if (G.phase !== 'call') return;
    Sound.tap();
    G.callAns[G.ask[G.callStep]] = val;
    G.callStep++;
    if (G.callStep < G.ask.length) { renderPanel(); Voice.say(callQuestion()); return; }
    G.callOK = evalCall(G.callAns, c, G.ask);
    save.stat.callRun = G.callOK ? (save.stat.callRun || 0) + 1 : 0;
    if (save.stat.callRun >= 10) award('mind');
    if (G.callOK) Sound.yes(); else Sound.no();
    G.phase = 'ready';
    // The coach confirms only what he was asked, then gives the KEY: who to watch and what each thing he can do means.
    // He never names the throw before the snap; the key defender decides that after it.
    const key = L.hint === 'key' ? RD.keySay(G.playId, G.cov).join(' ') : '';
    armHike(L, key);
    renderPanel();
    const gate = G.gate;
    Voice.say((G.callOK ? 'Yes! ' : 'Look again. ') + tellOf(c, G.ask).say + (key ? ' ' + key : ''), (n) => spokeKey(gate, n));
  }

  function hike() {
    if (G.phase !== 'ready' || !hikeOpen()) return;
    Sound.wake(); Sound.hike(); Voice.stop();
    G.phase = 'live'; acc = 0; G.rate = slowRate(0);
    renderPanel();
  }
  function throwTo(id) {
    if (G.phase !== 'live' || G.rep.result) return;
    if (watching()) return;          // Rookie's slow first steps: watch first. The tap is simply not taken (no penalty, no message).
    if (E.throwTo(G.rep, id)) {
      G.thrown = { id, t: G.rep.thrownAt };
      G.phase = 'ball'; Sound.toss(); renderPanel();
    }
  }

  function finishRep() {
    const r = G.rep.result, g = G.mode === 'game' ? G.game : null;
    const complete = r.type === 'complete';
    const listed = !!(G.thrown && G.rd.to.indexOf(G.thrown.id) >= 0);
    // In a game, the right read is what earns room to run. Any other catch is down where he caught it,
    // so quick throws that happen to be open against everything cannot march the field by themselves.
    const depth = r.at ? Math.round(r.at[1]) : 0;
    const yards = g && complete && !listed ? Math.min(r.yards, depth) : r.yards;
    const scored = complete && yards >= GOAL;
    const td = scored && !(g && g.xp);
    // A dump-off caught behind the line is a catch, but it does not earn the completion star:
    // otherwise tossing it to the back at the snap would score against every defense.
    // "past the line" is the line of scrimmage itself; a listed checkdown (a flare the coach calls for) counts too
    const past = complete && (r.at[1] >= 0 || listed);
    // the coach's star needs the right receiver AND a catch: an intercepted "right idea" does not earn it
    const smart = past && listed;
    const stars = (G.callOK ? 1 : 0) + (past ? 1 : 0) + (smart ? 1 : 0);
    G.res = { complete, past, smart, listed, td, scored, stars, type: r.type, yards, noRun: complete && yards < r.yards };
    save.stars[G.playId] = Math.max(save.stars[G.playId] || 0, stars);
    if (g) G.res.ev = gameOutcome(G.res, r);
    recordRep(G.res, G.cov, G.playId, G.repeat);
    const ev = G.res.ev;
    const H = ev && ev.kind === 'xpGood' ? ['GOOD!', 'good', `+${g.xp} point${g.xp > 1 ? 's' : ''}`]
      : ev && ev.kind === 'xpNo' ? ['NO GOOD', 'bad', 'No extra points']
        : {
          complete: td ? ['TOUCHDOWN!', 'good'] : ev && ev.kind === 'first' ? ['FIRST DOWN!', 'good', `+${yards} yards`] : ['COMPLETE', 'good', yards === 0 ? 'no gain' : `${yards > 0 ? '+' : ''}${yards} yards`],
          early: ['TOO EARLY', 'bad', 'He was not looking yet'],
          incomplete: ['COVERED', 'bad', 'Knocked down'],
          intercept: ['PICKED OFF', 'bad', 'A defender was right there'],
          tipped: ['TIPPED', 'bad', 'A defender was in the way'],
          sack: ['FLAG PULLED', 'bad', 'The rusher got you'],
          short: ['TOO FAR', 'bad', 'That throw could not get there'],
        }[r.type];
    setBanner(H[0], H[1], H[2]);
    if (td || (ev && ev.kind === 'xpGood')) { Sound.td(); if (td) Sound.cheer(); confetti(td ? 90 : 40, PARTY); } else if (complete) Sound.good(); else Sound.bad();
    G.headline = H;
    G.res.line = whyLine();                       // chosen once: the panel shows exactly what the coach says
    const run = SAY.run[save.streak];
    if (run && G.res.smart) toast(`<b>${save.streak} in a row!</b>`, 'gold');
    renderHud();
    // then what a hidden defense turned out to be, what the key defender did, and why that left the throw open
    // (the same sentences the result panel shows)
    const was = G.dz ? ' ' + showedLine(G.dz, G.covInfo) + ' ' + wasLine(G.covInfo) : '';
    const did = RD.didLine(G.playId, G.cov);
    Voice.say((td ? line('td') + ' ' : ev && ev.kind === 'first' ? line('first') + ' ' : '') + G.res.line + was + (did ? ' ' + did : '') + ' ' + reason() + (run && G.res.smart ? ' ' + run : ''));
  }

  // the coach's lines: short, kind, never the same twice in a row. The words on screen are the words he hears.
  const SAY = {
    smart: ['Great read!', 'Right on the money!', 'You read their minds!', 'Textbook throw!', 'Found the open grass!', 'Eyes in the right spot!', 'Sharp eyes!', 'You beat that coverage!', 'Right read, right on time!'],
    sack: ['Too slow. Throw sooner.', 'Rusher got there. Throw sooner!', 'Trust your first look!', 'Get the ball out fast!'],
    pick: ['Tough break.', 'Shake it off.', 'Happens to everyone.'],
    caught: ['Caught it!', 'Nice catch!', 'Good gain!'],
    first: ['Move those chains!', 'Fresh set of downs!', 'First down! Keep rolling!'],
    td: ['Touchdown! Six points!', 'Into the end zone! Touchdown!', 'Boom! Touchdown pass!'],
    win: ['Ballgame! You earned that win!', 'Victory! What a game!', 'Chalk up a big win!'],
    loss: ['Close battle! Run it back?', 'Almost had them! One more?', 'Good fight! Run it back?'],
    run: { 3: 'Three in a row! Heating up!', 5: 'Five straight! You are on fire!', 10: 'Ten in a row! Unstoppable!' },
  };
  const lastSaid = {};
  function line(kind) { const a = SAY[kind]; let i = Math.floor(Math.random() * a.length); if (a.length > 1 && i === lastSaid[kind]) i = (i + 1) % a.length; lastSaid[kind] = i; return a[i]; }

  function whyLine() {
    const res = G.res, t = G.thrown, open = G.openTo.length ? G.openTo : G.rd.to;
    if (res.type === 'sack') return line('sack');
    if (res.smart) return line('smart');
    if (res.type === 'intercept') return `${line('pick')} ${t.id} was covered.`;
    if (res.type === 'early') return res.listed ? `Right guy, too early. Wait for ${t.id} to look.` : `Too early. ${t.id} was not looking.`;
    if (res.type === 'tipped') return 'A defender was in the way.';
    if (res.type === 'short') return `${t.id} was too far away.`;
    if (res.complete && !res.past) return 'Caught behind the line.';
    if (res.complete) return `${line('caught')} Coach wanted ${names(open)}.`;
    if (res.listed) {
      const w = G.an.by[t.id].windows, late = w.length && t.t > w[w.length - 1].t1;
      return late ? 'Right guy, too late. Throw sooner.' : 'Right guy. A defender got there.';
    }
    return `${t.id} was covered. Coach wanted ${names(open)}.`;
  }

  function startReplay() {
    G.rp = { st: E.createRep(G.playId, G.cov, G.seed, G.eo), hold: 0.6, threw: false, done: false };
    G.phase = 'replay'; acc = 0; setBanner('');
    renderPanel();
  }

  function nextAfterResult() {
    Voice.stop();
    if (G.mode === 'game') gameNext(); else startRep();
  }
  function startPractice(playId) { G.mode = 'practice'; G.game = null; G.speed = null; show('play'); startRep(playId); }
  /* ---------- side panel: few words, big type; the field and the coach's voice carry the rest ---------- */
  function btn(cls, html, fn) { const b = el('button', 'btn ' + cls, html); b.type = 'button'; b.addEventListener('click', fn); return b; }
  function starsHtml(n, max) { let s = ''; for (let i = 0; i < (max || 3); i++) s += i < n ? '★' : '<i>★</i>'; return s; }
  function pipsHtml(id) { const pp = save.pips[id] || {}; return '<span class="pips">' + E.COV_ORDER.map((c) => `<i class="${pp[c] ? 'on' : ''}" title="${E.COVERAGES[c].name}">${c.slice(1)}</i>`).join('') + '</span>'; }
  function medalOf(id) { const pp = save.pips[id] || {}; const n = E.COV_ORDER.filter((c) => pp[c]).length; return n >= 4 ? 'gold' : n === 3 ? 'silver' : n >= 1 ? 'bronze' : ''; }

  function callOpts(onAns) {
    const kind = (G.ask || askFor(lvl(), null))[G.callStep], opts = el('div', 'opts');
    if (kind === 'name') E.COV_ORDER.forEach((id) => { const k = E.COVERAGES[id]; opts.appendChild(btn('opt', `${k.name}<small>${k.short}</small>`, () => onAns(id))); });
    else if (kind === 'deep') { opts.appendChild(btn('opt num', '1', () => onAns(1))); opts.appendChild(btn('opt num', '2', () => onAns(2))); }
    else { opts.appendChild(btn('opt', 'Up close', () => onAns('up'))); opts.appendChild(btn('opt', 'Backed off', () => onAns('back'))); }
    return opts;
  }
  function starRow(res) {
    const items = [[G.callOK, 'Read'], [res.past, 'Catch'], [res.smart, 'Coach’s pick']];
    return '<div class="star3">' + items.map((it) => `<span class="${it[0] ? 'on' : ''}"><b>★</b>${it[1]}</span>`).join('') + '</div>';
  }
  function miniPlay(c, id) {
    requestAnimationFrame(() => {
      const w = c.clientWidth || 120, h = w * 27 / 40, ctx = fitCanvas(c, w, h), v = makeView(w, h, -8, 19);
      drawScene(ctx, v, { rep: E.createRep(id, 'C4', 7), routes: 1, noDef: true, plain: true });
    });
  }
  function gameEventText(ev) {
    const g = G.game;
    return {
      first: 'First down!', td: 'Touchdown! +6', pick: 'Picked off. Drive over.', downs: 'Out of downs. Drive over.',
      xpGood: `Extra point${g.xp > 1 ? 's' : ''} good! +${g.xp}`, xpNo: 'No extra points.', otWin: 'You win it in overtime!', otNo: 'No score in overtime.',
    }[ev.kind] || `${DOWN[g.down]} down. ${g.crossed ? g.toGoal + ' to score' : g.toFirst + ' to the first down'}.`;
  }

  function renderHud() {
    if (!hud) return;
    const chips = [], g = G.game, chip = (cls, html) => chips.push(`<span class="chip ${cls}">${html}</span>`);
    if (G.mode === 'game' && g) {
      chip('score', `${gearOn('name').name} <b>${g.you}</b>`);
      if (!g.rookie) chip('score them', `${g.opp.short} <b>${g.them}</b>`);
      chip('', g.ot ? 'Overtime' : `Drive ${Math.max(1, g.drive)} of ${g.drives}`);
      const justScored = G.phase === 'xpPick' || ((G.phase === 'result' || G.phase === 'replay' || G.phase === 'hold') && G.res && G.res.ev && (G.res.ev.kind === 'td' || G.res.ev.end));
      if (G.phase !== 'intro' && G.phase !== 'final' && G.phase !== 'opp' && !justScored)
        chip('down', g.ot ? `${g.toGoal} to win` : g.xp ? `Extra point: ${g.toGoal} yards` : `<b>${DOWN[Math.min(g.down, 4)]}</b> down · ${g.crossed ? g.toGoal + ' to score' : g.toFirst + ' to first'}`);
    } else if (G.mode === 'speed' && G.speed) {
      chip('', 'Speed Round'); chip('score', `Score <b>${G.speed.score}</b>`);

    }
    if ((save.streak || 0) >= 2 && G.mode !== 'speed') chip('hot', `${save.streak} in a row`);
    hud.innerHTML = chips.join('') + `<span class="chip total" title="Stars">★ ${save.total}</span>`;
    const sb = document.getElementById('starBtn'); if (sb) sb.textContent = '★ ' + save.total;
  }

      add(el('p', 'q', callQuestion()));

    if (G.phase === 'ready') {

    if (G.phase === 'live' || G.phase === 'ball' || G.phase === 'hold') {

      // the card stays up, small, until the throw: he should not have to hold it in his head
      if (L.hint === 'key' && G.phase === 'live') add(keyCard(G.playId, G.cov, true)).id = 'keyMini';
      const r = add(el('div', 'recv' + (watching() ? ' wait' : '')));
      E.ELIG.forEach((id) => {
        // a hidden look: an option route's name would tell which defense it is before the key defender does
        const b = el('button', '', `${id}<small>${G.alt && G.alt[id] ? 'Option' : routeWord(G.rep.tls[id].name)}</small>`); b.type = 'button';
        b.disabled = G.phase !== 'live';

        b.addEventListener('click', () => throwTo(id));
        r.appendChild(b);

      // a hidden look: what they showed, and what it was

      else if (!G.callOK) add(el('p', 'help', `The defense was <b>${c.name}</b>: ${factLine(c)}`));

      add(el('div', 'didbox', (dt ? `<p class="did">${recChip(dt)}</p>` : '') + `<p class="because">${reason()}</p>`));
      const d = add(el('details', 'why'));
      const src = { playbook: 'This read is printed in the playbook.', rule: 'Built from the playbook’s route rule for this play.', coach: 'Coach’s rule of thumb. Not printed in the playbook.' }[G.rd.src];
      d.innerHTML = `<summary><b>${c.name}</b> → throw to <b>${names(to)}</b></summary><p>${G.rd.why}</p><p class="tag">${src}${G.rd.note ? ' ' + G.rd.note : ''}</p>`;
      if (res.newPip) add(el('p', 'event new', `New: you beat ${c.name} with this play! ${pipsHtml(G.playId)}`));
      if (res.noRun) add(el('p', 'help', 'Down where he caught it. The coach’s read gets room to run.'));
      if (ev) add(el('p', 'event', gameEventText(ev)));
      const row = add(el('div', 'row actions'));
      const nextLabel = G.mode !== 'game' ? 'Run it again' : ev.kind === 'td' && !g.ot ? 'Extra point' : ev.end ? 'Keep going' : 'Next play';
      row.appendChild(btn('go', nextLabel, nextAfterResult));
      row.appendChild(btn('', G.phase === 'replay' ? 'Replaying…' : 'Replay', startReplay));
      if (G.mode === 'practice') {
        const r2 = add(el('div', 'row'));
        r2.appendChild(btn('quiet', 'Same defense', () => startRep(null, true)));
        r2.appendChild(btn('quiet', 'Another play', () => show('pick')));
      }
      return;
    }
  }
  /* ---------- Game mode: drives, downs, a scoreboard, and an opponent with a favorite defense ---------- */
  // Mirrors USA Football 7-on-7 flag: start on your own 5, four downs to cross midfield (20 yards), then four downs to score
  // (25 more). Touchdown 6; extra point 1 from the 5 or 2 from the 10. Opponent odds and medal cutoffs come from 450,000
  // simulated games: a player who makes the coach's read 65% of the time wins about 6 in 10 on Starter and 5 in 10 on All-Pro.
  TUNE.game = { drives: 4, start: 45, firstAt: 20, downs: 4, oppTd: { starter: 0.34, allpro: 0.42 }, oppXp: 0.7, medals: { bronze: 6, silver: 13, gold: 21 } };   // no points, no medal: a medal has to mean a score
  const OPPONENTS = [
    { name: 'Skyline Condors', short: 'Condors', fav: ['C2'], line: 'Mostly two safeties deep, corners up close.' },
    { name: 'Brickwall Rhinos', short: 'Rhinos', fav: ['C1'], line: 'Mostly man to man, one safety deep.' },
    { name: 'Cloud Nine Owls', short: 'Owls', fav: ['C4'], line: 'Mostly four players deep. Short throws are open.' },
    { name: 'Centerfield Piranhas', short: 'Piranhas', fav: ['C3'], line: 'Mostly one safety in the middle. Corners back off.' },
    { name: 'Sandstorm Cobras', short: 'Cobras', fav: ['C2', 'C4'], line: 'Mostly two safeties deep. Check the corners.' },
    { name: 'Sonic Jackrabbits', short: 'Jackrabbits', fav: ['C1', 'C3'], line: 'Mostly one safety deep. Check the corners.' },
  ];
  function startGame() {
    const L = lvl(), T = TUNE.game;
    let opp = OPPONENTS[Math.floor(Math.random() * OPPONENTS.length)];
    if (G.game && G.game.opp === opp) opp = OPPONENTS[(OPPONENTS.indexOf(opp) + 1) % OPPONENTS.length];
    G.mode = 'game'; G.speed = null; G.covSel = 'random'; G.rep = null; G.play = null;
    G.game = { opp, rookie: L.id === 'rookie', level: L.id, drive: 0, drives: T.drives, you: 0, them: 0, toGoal: T.start, toFirst: T.firstAt, down: 1, crossed: false,
      xp: null, ot: false, plays: 0, stars: 0, sacks: 0, picks: 0, tds: 0, oppShow: null, final: null };
    GOAL = T.start; FIRST = T.firstAt;
    show('play'); G.phase = 'intro'; setBanner(''); renderPanel(); renderHud();
    Voice.say(G.game.rookie ? `Game day! ${opp.line}` : `Game day against the ${opp.short}. ${opp.line}`);
  }
  // each quarter the other team goes first, so he always gets the last word
  function nextQuarter() { const g = G.game; if (g.rookie) beginDrive(); else oppTurn(); }
  function beginDrive() {
    const g = G.game, T = TUNE.game;
    g.drive++; g.toGoal = T.start; g.toFirst = T.firstAt; g.down = 1; g.crossed = false; g.xp = null; g.oppShow = null;
    offerPlays();
  }
  function oppTurn() {
    const g = G.game, T = TUNE.game;
    G.phase = 'opp'; G.rep = null; g.oppShow = null; setBanner(''); renderPanel(); renderHud();
    const pts = Math.random() < T.oppTd[g.level] ? 6 + (Math.random() < T.oppXp ? 1 : 0) : 0;
    setTimeout(() => {
      if (G.game !== g || G.phase !== 'opp') return;
      g.them += pts; g.oppShow = pts; renderPanel(); renderHud();
      if (pts) Sound.bad(); else Sound.good();
      Voice.say(pts ? `The ${g.opp.short} scored. Your ball.` : 'Stopped them! Your ball.');
    }, 1300 / (TUNE.fast || 1));
  }
  function offerPlays() {
    const g = G.game;
    g.offer = shuffle(poolFor(lvl())).slice(0, 3);
    G.phase = 'pick3'; G.rep = null; G.play = null;
    GOAL = g.toGoal; FIRST = !g.crossed && !g.xp && !g.ot ? g.toFirst : 0;
    setBanner(''); renderPanel(); renderHud();
  }
  // apply one finished play to the drive; returns the event the result screen and the next step need
  function gameOutcome(res, r) {
    const g = G.game, ev = { kind: '', end: false };
    g.plays++; g.stars += res.stars;
    if (res.smart) g.smart = (g.smart || 0) + 1;
    if (r.type === 'intercept') g.picks++;
    if (r.type === 'sack') g.sacks++;
    if (g.ot) { if (res.scored) { g.you += 6; g.tds++; ev.kind = 'otWin'; } else ev.kind = 'otNo'; ev.end = true; return ev; }
    if (g.xp) { if (res.scored) { g.you += g.xp; ev.kind = 'xpGood'; } else ev.kind = 'xpNo'; ev.end = true; return ev; }
    if (r.type === 'intercept') { ev.kind = 'pick'; ev.end = true; return ev; }
    if (res.complete) {
      if (res.scored) { g.you += 6; g.tds++; ev.kind = 'td'; if (g.down === 4) award('clutch'); return ev; }
      g.toGoal -= res.yards; g.toFirst -= res.yards;
      if (!g.crossed && g.toFirst <= 0) { g.crossed = true; g.down = 1; ev.kind = 'first'; return ev; }
    }
    g.down++;
    if (g.down > TUNE.game.downs) { ev.kind = 'downs'; ev.end = true; }
    return ev;
  }
  function gameNext() {
    const g = G.game, ev = G.res.ev;
    if (ev.kind === 'td') { G.phase = 'xpPick'; setBanner(''); renderPanel(); renderHud(); Voice.say('Touchdown! Go for one, or two?'); return; }
    if (ev.end) { endDrive(); return; }
    offerPlays();
  }
  function chooseXp(n) { const g = G.game; Sound.tap(); g.xp = n; g.toGoal = n === 1 ? 5 : 10; g.down = 1; offerPlays(); }
  function endDrive() {
    const g = G.game; setBanner('');
    if (g.ot || g.drive >= g.drives) finishGame(); else nextQuarter();
  }
  function finishGame() {
    const g = G.game, T = TUNE.game, st = save.stat, b = save.best;
    if (!g.rookie && !g.ot && g.you === g.them) {       // tied: one play from the 10 decides it
      g.ot = true; g.xp = null; g.toGoal = 10; g.down = 1; g.crossed = true;
      Voice.say('Tie game! One play from the ten to win it.'); offerPlays(); return;
    }
    const f = { title: '', line: '', cls: 'good', medal: '', best: false };
    if (g.rookie) {
      f.medal = g.you >= T.medals.gold ? 'gold' : g.you >= T.medals.silver ? 'silver' : g.you >= T.medals.bronze ? 'bronze' : '';
      f.title = f.medal ? 'Final whistle!' : 'Good practice!';
      f.line = f.medal === 'gold' ? 'You saw the whole field.' : f.medal ? 'Nice game. Go for gold next time.' : 'Count the safeties first, every play.';
      if (f.medal === 'gold') award('gold');
    } else if (g.you > g.them) {
      f.title = 'You win!'; f.line = line('win');
      st['wins_' + g.level] = (st['wins_' + g.level] || 0) + 1; award(g.level === 'allpro' ? 'win2' : 'win1');
    } else if (g.you === g.them) { f.title = 'Tie game'; f.line = 'So close. Run it back?'; f.cls = ''; }
    else { f.title = `${g.opp.short} win`; f.line = line('loss'); f.cls = 'bad'; }
    if (g.plays >= 6 && !g.sacks && !g.picks && (g.smart || 0) >= 3) award('clean');   // clean AND reading, not just dumping it off
    b.game = b.game || {}; if (g.you > (b.game[g.level] || 0)) { b.game[g.level] = g.you; f.best = g.you > 0; }
    st.games = (st.games || 0) + 1;
    persist();
    g.final = f; G.phase = 'final'; G.rep = null; GOAL = 99; FIRST = 0; setBanner(''); renderPanel(); renderHud();
    if (f.cls === 'good' && (f.medal || !g.rookie)) { confetti(140, PARTY); Sound.td(); Sound.cheer(); }
    if (g.rookie && !f.medal) f.cls = '';
    Voice.say(`${/[.!?]$/.test(f.title) ? f.title : f.title + '.'} ${f.line}`);
  }

  /* ---------- Speed Round: only the pre-snap read, against the clock ---------- */
  function startSpeed() {
    G.mode = 'speed'; G.game = null; G.speed = { left: 60, score: 0, state: 'idle', flash: 0, ok: null, best: false };
    show('play'); speedDeal(); G.phase = 'speedIntro'; setBanner(''); renderPanel(); renderHud();
    Voice.say('Speed round! Read as many as you can.');
  }
  function speedDeal() {
    const pool = ALL.filter(isUnlocked), L = lvl();
    G.playId = pool[Math.floor(Math.random() * pool.length)];
    G.cov = E.COV_ORDER[Math.floor(Math.random() * 4)]; G.seed = Math.floor(Math.random() * 2147483647);
    G.rep = E.createRep(G.playId, G.cov, G.seed, { pressure: L.pressure });
    G.play = E.PLAY_BY_ID[G.playId]; G.covInfo = E.COVERAGES[G.cov];
    G.dz = null; G.alt = null; G.keyIds = []; G.ask = askFor(L, null);    // the Speed Round is always an honest look, as before
    G.callStep = 0; G.callAns = {}; GOAL = 22; FIRST = 0;
  }
  function speedGo() { Sound.wake(); G.speed.state = 'run'; G.phase = 'speed'; renderPanel(); renderHud(); }
  function speedAnswer(val) {
    const s = G.speed, L = lvl(), c = G.covInfo;
    if (!s || s.state !== 'run') return;
    if (L.call === 'name') G.callAns.name = val; else if (G.callStep === 0) G.callAns.deep = val; else G.callAns.corners = val;
    G.callStep++;
    if (G.callStep < (L.call === 'both' ? 2 : 1)) { Sound.tap(); renderPanel(); return; }
    s.ok = evalCall(G.callAns, c, G.ask);
    // a wrong answer costs a point and clock time, so guessing fast gets him nowhere
    if (s.ok) { s.score++; Sound.yes(); s.flash = 0.4; } else { s.score = Math.max(0, s.score - 1); Sound.no(); s.flash = 2.0; }
    s.state = 'flash'; renderPanel(); renderHud();
  }
  function speedTick(dt) {
    const s = G.speed;
    if (s.state !== 'run' && s.state !== 'flash') return;
    s.left -= dt;                                   // the clock never stops, feedback included
    const bar = document.getElementById('clockBar'); if (bar) bar.style.transform = `scaleX(${clamp(s.left / 60, 0, 1)})`;
    if (s.left <= 0) { speedEnd(); return; }
    if (s.state === 'flash') { s.flash -= dt; if (s.flash <= 0) { s.state = 'run'; speedDeal(); renderPanel(); } }
  }
  function speedEnd() {
    const s = G.speed, L = lvl(), b = save.best;
    s.state = 'done'; G.phase = 'speedEnd';
    b.speed = b.speed || {}; if (s.score > (b.speed[L.id] || 0)) { b.speed[L.id] = s.score; s.best = s.score > 0; }
    if (s.score >= 15) award('eyes');
    addStars(Math.min(5, Math.floor(s.score / 5))); persist();
    renderPanel(); renderHud(); Sound.td(); if (s.best) confetti(80, PARTY);
    Voice.say('Time!' + (s.best ? ' New record!' : ''));   // the score is on the screen; the coach has no clip for every number
  }
  /* ---------- field loop ---------- */
  function sizeField() {
    const wrap = $('#fieldWrap');
    const aw = wrap.clientWidth - 12, ah = wrap.clientHeight - 12;
    if (aw < 50 || ah < 50) return;
    const w = Math.min(aw, ah * 40 / 36), h = w * 36 / 40;
    fieldCtx = fitCanvas(cv, w, h);
    fieldView = makeView(w, h, -9, 27);
  }

  function updatePlay(dt) {
    const L = lvl();
    dt *= TUNE.fast || 1;          // tests run the clock faster; the game never sets this
    stepFx(dt);
    if (G.phase === 'speed') { speedTick(dt); return; }
    if (G.phase === 'ready') { syncHike(); return; }
    if (G.phase === 'live' || G.phase === 'ball') {
      // one clock for everything: while Rookie's first steps run slow, the rusher, the routes and the ball are slow too
      G.rate = slowRate(G.rep.t);
      acc += dt * L.speed * G.rate;
      while (acc >= E.DT && !G.rep.result) { E.step(G.rep, E.DT); acc -= E.DT; }
      syncLive();
      const bar = document.getElementById('clockBar');
      if (bar) { const lim = G.an.sackT || L.pressure; bar.style.transform = `scaleX(${clamp(1 - G.rep.t / lim, 0, 1)})`; }
      if (G.rep.result) { finishRep(); G.phase = 'hold'; G.resultAt = performance.now(); renderPanel(); }
    } else if (G.phase === 'hold') {
      if (performance.now() - G.resultAt > 1100 / (TUNE.fast || 1)) { G.phase = 'result'; renderPanel(); }
    } else if (G.phase === 'replay') {
      const rp = G.rp;
      if (rp.hold > 0) { rp.hold -= dt; }
      else if (!rp.done) {
        acc += dt * 0.5;
        while (acc >= E.DT && !rp.st.result) {
          if (G.thrown && !rp.threw && rp.st.t >= G.thrown.t - 1e-6) {
            rp.openAtThrow = E.ELIG.filter((id) => { const c = E.cloneRep(rp.st); E.throwTo(c, id); E.run(c, c.t + 6); return c.result && c.result.type === 'complete'; });
            E.throwTo(rp.st, G.thrown.id); rp.threw = true; rp.hold = 2.0; acc = 0; break;
          }

  /* ---------- Learn: the route tree (Mitch's nine-route sheet) ----------

  }

  async function check(reg) {
    try {
      const hit = await caches.match(new URL('./index.html', location.href).href);
      st.saved = !!hit && !!(reg && reg.active);
    } catch (e) { st.saved = false; }
    if (st.saved) st.failed = false;
    paint();
    return st.saved;
  }

  navigator.serviceWorker.register('./sw.js').then(async (reg) => {
    reg = await navigator.serviceWorker.ready;
    // from the Home Screen icon, ask the system to keep this copy even when space runs short
    try {
      if (navigator.storage && navigator.storage.persist) st.kept = standalone ? await navigator.storage.persist() : await navigator.storage.persisted();
    } catch (e) { st.kept = null; }
    if (!(await check(reg))) { st.failed = true; paint(); }
    if (navigator.onLine) reg.update().catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => check(reg));
  }).catch(() => { st.failed = true; paint(); });
  // a first visit with no connection never reaches "ready": say so instead of "Saving..." forever
  setTimeout(() => { if (!st.saved) { st.failed = true; paint(); } }, 20000);
})();

</script>
</body>
